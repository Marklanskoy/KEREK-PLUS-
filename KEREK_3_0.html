function date(s){const d=new Date(s);return Number.isNaN(d.getTime())?e(s):d.toLocaleString(S.language==='kk'?'kk-KZ':'ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function uid(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,13);}
function pby(id){return D.products.find(p=>p.id===String(id));}
function pack(p){if(p.unit==='pc')return p.pack+' '+L('шт.','дана');return new Intl.NumberFormat(S.language==='kk'?'kk-KZ':'ru-RU').format(p.pack>=1000?p.pack/1000:p.pack)+' '+(p.unit==='g'?(p.pack>=1000?'кг':'г'):(p.pack>=1000?L('л','л'):L('мл','мл')));}
function amount(v,u){return new Intl.NumberFormat(S.language==='kk'?'kk-KZ':'ru-RU',{maximumFractionDigits:1}).format(v)+' '+(u==='pc'?L('шт.','дана'):u==='g'?'г':'мл');}
function unitPrice(p){return money(Math.round(p.price/p.pack*(p.unit==='pc'?1:1000)))+'/'+(p.unit==='pc'?L('шт.','дана'):p.unit==='g'?'кг':'л');}

function photo(image,alt='',emoji='',lazy=true){
 const local=window.KEREK_LOCAL_PHOTOS?.[image],pid=D.photoIds[image];let src=local||(pid?'https://images.unsplash.com/photo-'+pid+'?auto=format&fit=crop&w=500&q=78':image?.startsWith('assets/uploads/')||image?.startsWith('https://images.unsplash.com/')?image:'');
 if(!/^(https:\/\/images\.unsplash\.com\/|assets\/|data:image\/(webp|png|jpeg);base64,)/.test(src))src='';
 return '<span class="photo"><span class="photo-fallback" aria-hidden="true">'+e(emoji||emojiByImage[image]||'🛍️')+'</span>'+(src?'<img src="'+e(src)+'" alt="'+e(alt)+'" '+(lazy?'loading="lazy"':'loading="eager"')+' decoding="async" referrerpolicy="no-referrer">':'<span class="hidden">'+e(alt)+'</span>')+'</span>';
}
function safeArrays(){for(const k of ['favorites','seen','pantry','orders','tickets','addresses','ledger'])if(!Array.isArray(S[k]))S[k]=[];S.cart=C.cleanCart(S.cart,D.products);S.favorites=[...new Set(S.favorites.map(String))].filter(id=>pby(id));S.seen=[...new Set(S.seen.map(String))].filter(id=>pby(id)).slice(0,12);S.pantry=S.pantry.filter(x=>x&&typeof x.ingredient==='string'&&Number.isFinite(Number(x.amount))&&['g','ml','pc'].includes(x.unit));S.addresses=S.addresses.filter(x=>x&&typeof x.text==='string');if(!['ru','kk'].includes(S.language))S.language='ru';if(!['light','dark'].includes(S.theme))S.theme='light';sanitizeHistory();}
function sanitizeHistory(){
 S.name=typeof S.name==='string'?S.name.slice(0,80):'';S.phone=typeof S.phone==='string'?S.phone.slice(0,30):'';
 S.orders=S.orders.filter(o=>o&&typeof o.id==='string'&&Array.isArray(o.items)&&o.quote&&Number.isFinite(Number(o.quote.total))).map(o=>({...o,items:o.items.filter(x=>x&&typeof x.name==='string'&&C.int(x.qty,1,99)),timeline:Array.isArray(o.timeline)?o.timeline.filter(x=>x&&typeof x.status==='string'):[]}));
 S.tickets=S.tickets.filter(x=>x&&typeof x.text==='string'&&typeof x.id==='string');
 S.ledger=S.ledger.filter(x=>x&&Number.isFinite(x.delta));
 S.addresses=S.addresses.slice(0,10).map(x=>({id:String(x.id||uid()).slice(0,100),label:String(x.label||L('Дом','Үй')).slice(0,80),text:x.text.slice(0,300),zone:String(x.zone||'almaty')}));
 S.pantry=S.pantry.filter(x=>x.amount>=0&&x.amount<=1000000).slice(0,150).map(x=>({...x,id:String(x.id||uid()),amount:Number(x.amount),expiresAt:typeof x.expiresAt==='string'?x.expiresAt:'',confirmed:x.confirmed===true}));
 S.balance=Math.max(0,Number(S.balance)||0);S.bonus=Math.max(0,Number(S.bonus)||0);S.promo=typeof S.promo==='string'?S.promo.slice(0,40):'';
}
function migrate(){
 if(load(KEY,null))return;
 const oldCart=load('kerek_basket',{}),oldFav=load('kerek_fav',[]),oldProfile=load('kerek_profile',{}),oldPantry=load('kerek_pantry',[]),oldOrders=load('kerek_orders',[]);
 S.cart=C.cleanCart(oldCart,D.products);S.favorites=Array.isArray(oldFav)?oldFav.map(String).filter(id=>pby(id)):[];
 S.name=typeof oldProfile.name==='string'?oldProfile.name.slice(0,80):'';S.phone=typeof oldProfile.phone==='string'?oldProfile.phone.slice(0,30):'';
 if(Array.isArray(oldPantry))S.pantry=oldPantry.map(id=>pby(id)).filter(Boolean).map(p=>({id:uid(),ingredient:p.ingredient,amount:p.pack,unit:p.unit,expiresAt:'',confirmed:false}));
 if(Array.isArray(oldOrders))S.orders=oldOrders.filter(o=>o&&Array.isArray(o.items)).map(o=>({id:'V2-'+String(o.id).slice(0,30),createdAt:new Date().toISOString(),legacyDate:String(o.date||''),status:'created',address:String(o.address||''),slot:String(o.slot||''),demo:true,legacy:true,items:o.items.map(x=>{let p=D.products.find(p=>p.name.startsWith(String(x.name))||p.name===x.name);return {id:p?.id||'',name:String(x.name),qty:Math.min(99,Math.max(1,Number(x.qty)||1)),price:0};}),quote:{total:Number(o.total)||0,bonus:0,bonusEarned:0},timeline:[]}));
 const oldSupport=load('kerek_support',[]);if(Array.isArray(oldSupport))S.tickets=oldSupport.filter(x=>x&&x.text).map(x=>({id:'V2-'+uid().slice(0,8),text:String(x.text),createdAt:new Date().toISOString(),status:'open',reply:'',demo:true}));
}
function write(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){storageWarning=true;}}
function userState(){return {name:S.name,language:S.language,notifications:S.notifications,addresses:S.addresses.map(a=>({id:a.id,label:a.label,text:a.text,zone:a.zone||'almaty'})),favorites:S.favorites,pantry:S.pantry,cart:S.cart};}
async function sync(){if(!API.enabled||!user)return true;clearTimeout(savingTimer);try{await API.request('me',{method:'PUT',body:userState()});return true;}catch(err){toast(L('Не удалось синхронизировать. Данные остались на этом устройстве.','Синхрондау орындалмады. Деректер осы құрылғыда сақталды.'));return false;}}
function save(remote=true){write();if(remote&&API.enabled&&user){clearTimeout(savingTimer);savingTimer=setTimeout(sync,500);}}
function applyUser(u){user=u;const p=u.state||{};for(const k of ['name','language','notifications','addresses','favorites','pantry','cart'])if(p[k]!==undefined)S[k]=p[k];S.phone=u.phone||'';S.balance=u.balance||0;S.ledger=u.ledger||[];safeArrays();save(false);}
function toast(text,action=null){clearTimeout(toastTimer);const el=$('#toast');el.innerHTML='<span>'+e(text)+'</span>'+(action?'<button data-action="'+e(action.action)+'">'+e(action.label)+'</button>':'');el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),action?7000:4300);}

function expiration(x){if(!x.expiresAt)return '';const today=new Date().toISOString().slice(0,10),delta=(new Date(x.expiresAt+'T12:00:00')-new Date(today+'T12:00:00'))/86400000;if(delta<0)return '<span class="expired">'+L('Срок истёк · не используется в подборе','Мерзімі өтті · таңдауда қолданылмайды')+'</span>';if(delta<=3)return '<span class="expiring">'+L('Срок скоро истекает: ','Мерзімі жақында өтеді: ')+e(x.expiresAt)+'</span>';return '<span class="small">'+L('Годен до ','Жарамдылық мерзімі ')+e(x.expiresAt)+'</span>';}

function support(){return heading(L('Мы рядом','Біз жаныңыздамыз'),L('Вопрос по продуктам, заказу или возврату? Сохраните обращение.','Өнім, тапсырыс немесе қайтару туралы сұрақ бар ма? Өтініш қалдырыңыз.'))+'<div class="two-columns"><div class="card"><h2 style="font-size:23px">'+L('Написать в поддержку','Қолдауға жазу')+'</h2><p class="note">'+(API.enabled?L('Обращение попадёт в тестовую админ-панель. Реальная служба поддержки не подключена. Возврат — запрос на рассмотрение, а не возврат денег.','Өтініш сынақ әкімші панеліне түседі. Нақты қолдау қызметі қосылмаған. Қайтару — қарау сұрауы, ақша қайтару емес.'):L('Без сервера обращение сохраняется только на этом устройстве. Никому не отправляется.','Серверсіз өтініш тек осы құрылғыда сақталады. Ешкімге жіберілмейді.'))+'</p><form data-form="support"><div class="form-grid"><label class="field">'+L('Тема','Тақырып')+'<select name="kind"><option value="support">'+L('Вопрос / проблема','Сұрақ / мәселе')+'</option><option value="return">'+L('Запрос на возврат','Қайтару сұрауы')+'</option></select></label><label class="field">'+L('Заказ','Тапсырыс')+'<select name="orderId"><option value="">'+L('Без привязки к заказу','Тапсырысқа қатыссыз')+'</option>'+S.orders.filter(o=>!o.legacy).map(o=>'<option value="'+e(o.id)+'" '+(V.supportOrder===o.id?'selected':'')+'>'+e(o.id)+'</option>').join('')+'</select></label></div><label class="field">'+L('Ваше сообщение','Хабарламаңыз')+'<textarea name="text" minlength="5" maxlength="3000" required placeholder="'+L('Расскажите, что произошло. Не указывайте платёжные данные.','Не болғанын айтыңыз. Төлем деректерін жазбаңыз.')+'"></textarea></label><button type="submit" class="btn primary">'+L('Создать обращение','Өтініш жасау')+'</button></form><h3 class="mt">'+L('Ваши обращения','Өтініштеріңіз')+'</h3>'+(S.tickets.length?S.tickets.map(t=>'<div class="ticket"><div class="flex between"><b>'+e(t.id)+'</b><span class="pill">'+(t.status==='open'?L('Открыто','Ашық'):t.status==='answered'?L('Есть ответ','Жауап бар'):L('Закрыто','Жабық'))+'</span></div><p>'+e(t.text)+'</p><span class="small">'+date(t.createdAt)+'</span>'+(t.reply?'<div class="ticket-reply mt">'+e(t.reply)+'</div>':'')+'</div>').join(''):'<p class="small">'+L('Обращений пока нет.','Әзірге өтініш жоқ.')+'</p>')+'</div><div class="card"><h3>'+L('Честно о возможностях','Мүмкіндіктер туралы ашық')+'</h3><div class="stack"><p class="small">'+L('Отмена доступна до передачи курьеру. Тестовые остатки и списанные бонусы возвращаются на сервере.','Курьерге берілгенге дейін болдырмауға болады. Сынақ қалдығы мен жұмсалған бонустар серверде қайтарылады.')+'</p><p class="small">'+L('Платежи Kaspi, банковские карты, карта курьера, внешние SMS и фоновый push пока не подключены.','Kaspi төлемі, банк карталары, курьер картасы, сыртқы SMS және фондық push әзірге қосылмаған.')+'</p></div>'+btn('about',L('Все ограничения версии','Нұсқаның барлық шектеуі'),'outline block','','info')+'</div></div>';}
function rememberCheckout(){const f=$('#checkout-form');if(f)for(const k of ['address','slot','zone','comment','replacements'])if(f.elements[k])V.checkout[k]=f.elements[k].value;}

function render(){
const active=document.activeElement,searchFocused=active?.id==='global-search',pos=searchFocused?active.selectionStart:0;
 document.documentElement.lang=S.language;document.body.dataset.theme=S.theme;document.title='KEREK · '+({home:L('Всё, что нужно','Керектінің бәрі'),catalog:L('Каталог','Каталог'),smart:L('Умная корзина','Ақылды себет'),cart:L('Корзина','Себет')}[V.view]||'KEREK');
 $('#app').innerHTML=header()+'<main class="wrap main" id="main" tabindex="-1">'+(storageWarning?'<p class="note">'+L('Браузер ограничил сохранение или обнаружены повреждённые старые данные. Часть данных может не пережить перезагрузку.','Браузер сақтауды шектеді немесе ескі деректер бүлінген. Кейбір дерек қайта жүктегенде сақталмауы мүмкін.')+'</p>':'')+(pages[V.view]||home)()+'</main>'+footer()+bottom();
 fixEmbeddedLogo();
 if(searchFocused){const s=$('#global-search');s.focus({preventScroll:true});try{s.setSelectionRange(pos,pos);}catch(_){}}
}
function fixEmbeddedLogo(){if(window.KEREK_ICON_DATA)document.querySelectorAll('.brand-icon').forEach(i=>i.src=window.KEREK_ICON_DATA);}
function navigate(view,opts={}){rememberCheckout();V.view=pages[view]?view:'home';if(opts.clearQuery)V.query='';if(V.view!=='product')V.selectedProduct=null;const hash='#'+V.view+(V.view==='product'?'/'+V.selectedProduct:'');if(location.hash!==hash)history.replaceState(null,'',hash);render();if(opts.scroll!==false)window.scrollTo(0,0);if(['orders','club','support'].includes(V.view)&&API.enabled&&user)refreshAccount(false).catch(err=>toast(errText(err)));}
function goProduct(id){if(!pby(id))return;S.seen=[id,...S.seen.filter(x=>x!==id)].slice(0,12);save(false);V.selectedProduct=id;V.view='product';history.replaceState(null,'','#product/'+id);render();scrollTo(0,0);}
function openModal(title,html){const d=$('#modal');d.innerHTML='<div class="modal-head"><h2 id="modal-title">'+title+'</h2><button class="icon-btn" data-action="close-modal" aria-label="'+L('Закрыть','Жабу')+'">'+icon('close')+'</button></div><div class="modal-body">'+html+'</div>';if(!d.open)d.showModal();}
function closeModal(){const d=$('#modal');d.close();d.innerHTML='';}
function errorBox(el,err){if(el)el.innerHTML='<p class="error-box">'+e(errText(err))+'</p>';else toast(errText(err));}
function addProduct(id,delta=1){if(V.busy)return;const p=pby(id);if(!p||!p.active)return;const next=(S.cart[id]||0)+delta;if(next>Math.min(p.stock,99)){toast(L('Достигнут доступный остаток.','Қолжетімді қалдыққа жетті.'));return;}if(next<=0){undo=C.clone(S.cart);delete S.cart[id];toast(L('Товар убран из корзины','Өнім себеттен алынды'),{label:L('Вернуть','Қайтару'),action:'undo-cart'});}else S.cart[id]=next;S.pendingOrder=null;save();render();}
function addBasket(cart,replace=false){const merged=replace?{}:C.clone(S.cart);let shortage=false;for(const [id,qty] of Object.entries(cart)){const p=pby(id);if(!p||!p.active||p.stock<=0){shortage=true;continue;}const n=(merged[id]||0)+qty;if(n>Math.min(99,p.stock))shortage=true;merged[id]=Math.min(99,p.stock,n);}if(shortage){toast(L('Не добавлено: выбранное количество превышает остаток. Проверьте корзину.','Қосылмады: таңдалған мөлшер қалдықтан асады. Себетті тексеріңіз.'));return false;}S.cart=merged;S.pendingOrder=null;save();return true;}
async function refreshCatalogue(){if(!API.enabled)return;const d=await API.request('bootstrap');D={...D,...d};}
async function refreshAccount(visible=true){if(API.enabled&&user){const [u,orders,tickets]=await Promise.all([API.request('me'),API.request('orders'),API.request('support')]);user=u;S.balance=u.balance;S.ledger=u.ledger;S.orders=[...orders,...S.orders.filter(o=>o.legacy)];S.tickets=tickets;await refreshCatalogue();save(false);render();if(visible)toast(L('Данные обновлены','Деректер жаңартылды'));}else if(visible)toast(L('В локальном режиме автоматических статусов нет.','Жергілікті режимде автоматты күйлер жоқ.'));}
function addressModal(){openModal(L('Куда привезти продукты?','Өнімдерді қайда жеткіземіз?'),'<p class="small">'+L('Алматы · адрес вводится вручную, карта не подключена.','Алматы · мекенжай қолмен енгізіледі, карта қосылмаған.')+'</p>'+S.addresses.map(a=>'<button class="address-card" data-action="pick-address" data-id="'+e(a.id)+'" style="width:100%;text-align:left"><div><b>'+e(a.label)+'</b><p>'+e(a.text)+'</p></div>'+icon('check')+'</button>').join('')+'<form data-form="address"><label class="field">'+L('Название','Атауы')+'<input name="label" placeholder="'+L('Дом, работа…','Үй, жұмыс…')+'" maxlength="50" required></label><label class="field">'+L('Улица, дом, квартира','Көше, үй, пәтер')+'<input name="text" autocomplete="street-address" placeholder="'+L('Например: ул. Абая, 10, кв. 5','Мысалы: Абай көш., 10, 5-пәтер')+'" minlength="6" maxlength="300" required></label><label class="field">'+L('Зона','Аймақ')+'<select name="zone">'+D.settings.zones.filter(z=>z.enabled).map(z=>'<option value="'+e(z.id)+'">'+e(z.name)+'</option>').join('')+'</select></label><button class="btn primary block" type="submit">'+L('Сохранить адрес','Мекенжайды сақтау')+'</button></form>');}

 if(!API.enabled){openModal(L('Ваш локальный профиль','Жергілікті профиліңіз'),'<p class="note">'+L('Сервер не подключён. Здесь можно сохранить имя, но нельзя зарегистрировать аккаунт или подтвердить телефон.','Сервер қосылмаған. Мұнда есімді сақтауға болады, бірақ аккаунт тіркеу немесе телефонды растау мүмкін емес.')+'</p><form data-form="local-login"><label class="field">'+L('Имя','Есім')+'<input name="name" maxlength="80" required value="'+e(S.name)+'"></label><button type="submit" class="btn primary block">'+L('Сохранить на устройстве','Құрылғыда сақтау')+'</button></form>');return;}

function recipeModal(id){const r=D.recipes.find(r=>r.id===id);if(!r)return;const a=C.aggregate([id],V.recipePeople,D.recipes,D.products,S.pantry),quote=C.quote(a.cart,D.products,D.settings);openModal(e(name(r)),'<div class="modal-product-photo">'+photo(r.image,name(r))+'</div><div class="flex between"><span class="pill">'+icon('clock')+r.minutes+' '+L('мин','мин')+' · '+V.recipePeople+' '+L('порц.','үлес')+'</span><b>'+money(quote.total)+'</b></div><p class="small mt">'+L('Недостающие упаковки с доставкой. Продукты из запасов не покупаем повторно.','Жетіспейтін қаптамалар жеткізумен. Қордағы өнімдерді қайта алмаймыз.')+'</p>'+a.details.map(x=>'<div class="ingredient-row"><div><b>'+e(ingredientName(x.ingredient))+'</b><span>'+L('Нужно: ','Қажет: ')+amount(x.required,x.unit)+(x.fromHome?' · '+L('дома ','үйде ')+amount(x.fromHome,x.unit):'')+'</span></div><b>'+ (x.id?x.qty+' × '+pack(pby(x.id)):L('Есть дома','Үйде бар'))+'</b></div>').join('')+'<h3 class="mt">'+L('Как приготовить','Дайындау тәсілі')+'</h3><ol class="recipe-steps">'+(S.language==='kk'?r.steps_kk:r.steps).map(step=>'<li>'+e(step)+'</li>').join('')+'</ol>'+ (a.missing.length?'<p class="error-box">'+L('Не хватает товаров в каталоге: ','Каталогта өнім жетіспейді: ')+a.missing.map(ingredientName).map(e).join(', ')+'</p>':btn('add-recipe',L('Купить всё для рецепта','Рецептке керектінің бәрін алу'),'primary block','data-id="'+r.id+'"','cart'))+'<p class="small mt">'+L('Добавим к текущей корзине. Её общий итог может отличаться от стоимости отдельного рецепта.','Ағымдағы себетке қосамыз. Оның жалпы сомасы жеке рецепт құнынан өзгеше болуы мүмкін.')+'</p>');}
function savingsModal(){const alternatives=C.cheaper(S.cart,D.products);openModal('KEREK Save','<p class="small">'+L('Замены с тем же базовым ингредиентом. Состав и марки могут отличаться — проверяйте упаковку.','Негізгі ингредиенті бірдей ауыстырулар. Құрамы мен бренді өзгеше болуы мүмкін — қаптаманы тексеріңіз.')+'</p>'+alternatives.map(a=>{const from=pby(a.from),to=pby(a.to);return '<div class="card" style="margin-top:12px;padding:17px"><p class="small">'+e(name(from))+' · '+e(from.brand)+' →</p><h3>'+e(name(to))+' · '+e(to.brand)+'</h3><div class="flex between"><span class="small">'+a.qty+' × '+pack(to)+' · '+money(to.price*a.qty)+'</span><b>−'+money(a.saving)+'</b></div>'+btn('apply-saving',L('Подтвердить замену','Ауыстыруды растау'),'secondary block small-btn','data-from="'+a.from+'" data-to="'+a.to+'" data-qty="'+a.qty+'"')+'</div>';}).join(''));}
function planReplace(key){const d=V.plan.details.find(x=>x.ingredient===key);if(!d)return;const ps=D.products.filter(p=>p.active&&p.stock&&p.ingredient===key&&p.unit===d.unit&&Math.ceil(d.needed/p.pack)<=p.stock);openModal(L('Выберите замену','Ауыстыруды таңдаңыз'),'<p class="small">'+L('Для плана нужно ','Жоспарға керек ')+amount(d.needed,d.unit)+'. '+L('Сумма пересчитается по целым упаковкам.','Сома толық қаптамалармен қайта есептеледі.')+'</p>'+ps.map(p=>'<div class="address-card"><div><b>'+e(name(p))+' · '+e(p.brand)+'</b><p>'+Math.ceil(d.needed/p.pack)+' × '+pack(p)+' = '+money(Math.ceil(d.needed/p.pack)*p.price)+'</p></div>'+btn('choose-plan-product',p.id===d.id?L('Выбран','Таңдалды'):L('Выбрать','Таңдау'),'secondary small-btn','data-key="'+e(key)+'" data-id="'+p.id+'"')+'</div>').join(''));}
function planDish(index){const o=V.plan.options;const rs=D.recipes.filter(r=>r.meal===o.meal&&r.minutes<=o.minutes).filter(r=>!C.makePlan({...o,days:1,recipe:r.id},D.products,D.recipes,D.settings,S.pantry).error);openModal(L('Заменить блюдо','Тағамды ауыстыру'),'<p class="small">'+L('После замены заново посчитаем все общие ингредиенты и доставку.','Ауыстырғаннан кейін ортақ ингредиенттер мен жеткізуді қайта есептейміз.')+'</p>'+rs.map(r=>'<div class="address-card"><div><b>'+e(name(r))+'</b><p>'+r.minutes+' '+L('мин','мин')+'</p></div>'+btn('choose-plan-dish',L('Выбрать','Таңдау'),'secondary small-btn','data-id="'+r.id+'" data-index="'+index+'"')+'</div>').join(''));}
function editPantry(id){const x=S.pantry.find(x=>x.id===id);if(!x)return;openModal(e(ingredientName(x.ingredient)),'<form data-form="edit-pantry" data-id="'+e(id)+'"><label class="field">'+L('Фактическое количество, ','Нақты мөлшер, ')+amount(1,x.unit).replace(/^1\s*/,'')+'<input name="amount" type="number" min="0.1" max="1000000" step="0.1" value="'+Number(x.amount)+'" required></label><label class="field">'+L('Годен до','Жарамдылық мерзімі')+'<input type="date" name="expiresAt" value="'+e(x.expiresAt)+'"></label><label class="check"><input name="confirm" type="checkbox" required>'+L('Количество проверено','Мөлшері тексерілді')+'</label><button type="submit" class="btn primary block">'+L('Сохранить','Сақтау')+'</button></form>');}
function pantryFromOrders(){if(!S.orders.length){toast(L('Сначала создайте тестовый заказ или добавьте запасы вручную.','Алдымен сынақ тапсырысын жасаңыз немесе қорды қолмен қосыңыз.'));return;}openModal(L('Что уже приехало домой?','Үйге не жеткізілді?'),'<p class="note">'+L('Ничего не добавляется автоматически. Выберите список, затем подтвердите фактическое наличие продуктов. Это не меняет статус доставки.','Ештеңе автоматты түрде қосылмайды. Тізімді таңдап, өнімнің нақты барын растаңыз. Бұл жеткізу күйін өзгертпейді.')+'</p>'+S.orders.map(o=>'<div class="address-card"><div><b>'+e(o.id)+'</b><p>'+o.items.length+' '+L('позиций','позиция')+'</p></div>'+btn('import-order-pantry',L('Проверить','Тексеру'),'secondary small-btn','data-id="'+e(o.id)+'"')+'</div>').join(''));}
function importPantryModal(id){const o=S.orders.find(o=>o.id===id);if(!o)return;openModal(L('Подтвердите домашние запасы','Үйдегі қорды растаңыз'),'<form data-form="import-pantry" data-id="'+e(id)+'"><p class="small">'+L('Отметьте только те продукты, которые действительно есть дома. Количество можно исправить.','Үйде шынымен бар өнімдерді ғана белгілеңіз. Мөлшерін түзете аласыз.')+'</p>'+o.items.filter(x=>pby(x.id)).map(x=>{const p=pby(x.id);return '<div class="ingredient-row"><label class="check"><input type="checkbox" name="use-'+e(x.id)+'">'+e(name(p))+'</label><input style="max-width:105px" name="amount-'+e(x.id)+'" type="number" min="0.1" max="1000000" step="0.1" value="'+p.pack*x.qty+'" aria-label="'+e(name(p))+'"><span>'+amount(1,p.unit).replace(/^1\s*/,'')+'</span></div>';}).join('')+'<button type="submit" class="btn primary block mt">'+L('Подтвердить и добавить','Растау және қосу')+'</button></form>');}
function notifications(){const today=new Date().toISOString().slice(0,10),soon=S.pantry.filter(x=>x.expiresAt&&(new Date(x.expiresAt)-new Date(today))/86400000<=3);openModal(L('Ваши напоминания','Еске салуларыңыз'),S.notifications?(soon.length?soon.map(x=>'<div class="address-card"><div><b>'+e(ingredientName(x.ingredient))+'</b><p>'+expiration(x)+'</p></div>'+icon('bell')+'</div>').join(''):'<p class="muted">'+L('У продуктов с указанным сроком нет срочных напоминаний.','Мерзімі көрсетілген өнімдер бойынша шұғыл еске салу жоқ.')+'</p>'):'<p>'+L('Напоминания отключены в настройках.','Еске салулар параметрлерде өшірілген.')+'</p>');}
function about(){openModal('KEREK 3.0','<p>'+L('Рабочая версия для проверки магазина, а не запущенный сервис доставки.','Дүкенді тексеруге арналған жұмыс нұсқасы, іске қосылған жеткізу қызметі емес.')+'</p><div class="note">'+L('Сервер: каталог, база заказов, тестовый вход, поддержка, бонусный журнал и защищённая админ-панель. Статическая версия: данные только в браузере.','Сервер: каталог, тапсырыс дерекқоры, сынақ кіруі, қолдау, бонус журналы және қорғалған әкімші панелі. Статикалық нұсқа: деректер тек браузерде.')+'</div><h3 class="mt">'+L('Что ещё нужно подключить','Әлі нені қосу керек')+'</h3><p class="small">'+L('Поставщика с реальным каталогом и подтверждённым составом; SMS-провайдера; официальную оплату; доставку и геокодирование; фоновый push. Нейросеть не подключена: помощник работает по правилам и рецептам.','Нақты каталог пен расталған құрам беретін жеткізушіні; SMS провайдерін; ресми төлемді; жеткізу мен геокодтауды; фондық push-ты. Нейрожелі қосылмаған: көмекші ереже мен рецепттер бойынша жұмыс істейді.')+'</p><p class="small">'+L('Нет автоматического списания запасов, возврата реальных денег или обещания пищевой безопасности. Перед коммерческим запуском нужны проверка безопасности, правила обработки данных, договоры и проверка перевода носителем казахского языка.','Қор автоматты есептен шықпайды, нақты ақша қайтарылмайды және тағам қауіпсіздігіне уәде берілмейді. Коммерциялық іске қосу алдында қауіпсіздікті, деректерді өңдеу ережесін, шарттарды және қазақша аударманы тіл иесімен тексеру керек.')+'</p>');}
function applyPlan(){const p=V.plan;if(!p||p.error||p.quote.total>p.options.budget)return;if(cartCount()&&!confirm(L('Заменить текущую корзину продуктами из плана?','Ағымдағы себетті жоспар өнімдерімен ауыстырамыз ба?')))return;if(addBasket(p.cart,true)){S.promo='';S.bonus=0;save();navigate('cart');toast(L('Корзина собрана. Итог включает доставку.','Себет жиналды. Қорытындыға жеткізу кіреді.'));}}
async function cancelOrder(id){const o=S.orders.find(o=>o.id===id);if(!o)return;if(!confirm(L('Отменить тестовый заказ?','Сынақ тапсырысын болдырмаймыз ба?')))return;if(API.enabled&&!o.legacy){await API.request('orders/'+encodeURIComponent(id)+'/cancel',{method:'POST',body:{}});await refreshAccount(false);}else{if(!['created','assembling','ready'].includes(o.status))return;o.status='cancelled';o.timeline.push({status:'cancelled',at:new Date().toISOString()});S.balance+=(o.quote.bonus||0);save(false);render();}toast(L('Заказ отменён. Реальных списаний не было.','Тапсырыс болдырылмады. Нақты ақша алынған жоқ.'));}
async function logout(){if(API.enabled&&user){clearTimeout(savingTimer);await sync();await API.request('auth/logout',{method:'POST',body:{}});}API.setSession('');const language=S.language,theme=S.theme;S=C.clone(defaults);S.language=language;S.theme=theme;user=null;V.plan=null;save(false);closeModal();navigate('profile');toast(L('Вы вышли. Личные данные убраны с этого устройства.','Шықтыңыз. Жеке деректер осы құрылғыдан алынды.'));}
async function exportData(){const payload=API.enabled&&user?await API.request('me/export'):S;const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KEREK-my-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
async function deleteData(){if(!confirm(L('Удалить профиль и личные данные KEREK? Это действие нельзя отменить. Серверные заказы будут обезличены.','KEREK профилі мен жеке деректерді жоямыз ба? Бұл әрекет қайтарылмайды. Серверлік тапсырыстар иесіздендіріледі.')))return;clearTimeout(savingTimer);if(API.enabled&&user)await API.request('me',{method:'DELETE',body:{confirm:'DELETE'}});API.setSession('');try{[KEY,'kerek_basket','kerek_fav','kerek_pantry','kerek_orders','kerek_profile','kerek_support'].forEach(k=>localStorage.removeItem(k));}catch(_){}S=C.clone(defaults);user=null;V.plan=null;save(false);navigate('home');toast(L('Личные данные удалены.','Жеке деректер жойылды.'));}
async function action(el){const a=el.dataset.action,id=el.dataset.id;
 if(a==='close-modal'){closeModal();return;}
 if(a==='nav'){closeModal();if(el.dataset.view==='catalog'&&V.view!=='catalog'){V.sale=false;V.category='all';V.subcategory='all';}navigate(el.dataset.view,{clearQuery:true});return;}
 if(a==='theme'){S.theme=S.theme==='light'?'dark':'light';save(false);render();return;}
 if(a==='language'){S.language=S.language==='ru'?'kk':'ru';save();closeModal();render();return;}
 if(a==='category'){V.category=id;V.subcategory='all';V.query='';closeModal();navigate('catalog');return;}
 if(a==='subcategory'){V.subcategory=id;render();return;}
 if(a==='sales'){V.sale=true;V.category='all';V.query='';navigate('catalog');return;}
 if(a==='filters'){openModal(L('Фильтры товаров','Өнім сүзгілері'),filters(true)+btn('close-modal',L('Показать товары','Өнімдерді көрсету'),'primary block mt'));return;}
 if(a==='reset-filters'){Object.assign(V,{query:'',category:'all',subcategory:'all',brand:'all',sale:false,available:false,min:0,max:100000});closeModal();render();return;}
 if(a==='product'){closeModal();goProduct(id);return;}
 if(a==='add'||a==='minus'){addProduct(id,a==='add'?1:-1);return;}
 if(a==='favorite'){S.favorites=S.favorites.includes(id)?S.favorites.filter(x=>x!==id):[...S.favorites,id];save();render();return;}
 if(a==='remove'){undo=C.clone(S.cart);delete S.cart[id];S.pendingOrder=null;save();render();toast(L('Удалено из корзины','Себеттен жойылды'),{label:L('Вернуть','Қайтару'),action:'undo-cart'});return;}
 if(a==='clear-cart'){if(!confirm(L('Очистить корзину?','Себетті тазалаймыз ба?')))return;undo=C.clone(S.cart);S.cart={};S.pendingOrder=null;save();render();toast(L('Корзина очищена','Себет тазаланды'),{label:L('Вернуть','Қайтару'),action:'undo-cart'});return;}
 if(a==='undo-cart'){if(undo){S.cart=C.cleanCart(undo,D.products);undo=null;save();render();toast(L('Товары восстановлены','Өнімдер қалпына келтірілді'));}return;}
 if(a==='use-bonus'){S.bonus=el.checked?q().maxBonus:0;save(false);render();return;}
 if(a==='savings'){savingsModal();return;}
 if(a==='apply-saving'){const from=pby(el.dataset.from),to=pby(el.dataset.to),qty=Number(el.dataset.qty);if(!from||!to||!S.cart[from.id])return;const merged=(S.cart[to.id]||0)+qty;if(merged>Math.min(to.stock,99)){toast(L('Недостаточно остатка для замены','Ауыстыруға қалдық жеткіліксіз'));return;}delete S.cart[from.id];S.cart[to.id]=merged;save();closeModal();render();toast(L('Замена подтверждена','Ауыстыру расталды'));return;}
 if(a==='address'){addressModal();return;}
 if(a==='pick-address'||a==='default-address'){const adr=S.addresses.find(x=>x.id===id);if(adr){S.addresses=[adr,...S.addresses.filter(x=>x.id!==id)];V.checkout.address=adr.text;V.checkout.zone=adr.zone||'almaty';save();closeModal();render();}return;}
 if(a==='remove-address'){S.addresses=S.addresses.filter(x=>x.id!==id);save();render();return;}
 if(a==='profile-tab'){V.profile=id;render();return;}
 if(a==='login'){login();return;}
 if(a==='logout'){await logout();return;}
 if(a==='plan-example'){V.planText=({week:L('Ужины на неделю для 2 человек за 20 000 ₸','2 адамға бір аптаға кешкі ас 20 000 ₸'),plov:L('Плов на 6 человек за 15 000 ₸','6 адамға палау 15 000 ₸'),breakfast:L('Завтраки на 5 дней для 2 человек за 15 000 ₸','2 адамға 5 күн таңғы ас 15 000 ₸')})[id];V.planner=C.parseRequest(V.planText,{...V.planner,recipe:null,exclude:[],vegetarian:false});V.plan=null;render();return;}
 if(a==='parse-request'){V.planText=$('#plan-request')?.value||'';V.planner=C.parseRequest(V.planText,{...V.planner,recipe:null,exclude:[],vegetarian:false});V.plan=null;render();toast(L('Параметры распознаны по шаблонам. Проверьте их перед подбором.','Параметрлер үлгілермен танылды. Таңдау алдында тексеріңіз.'));return;}
 if(a==='reset-recipe'){delete V.planner.recipe;V.plan=null;render();return;}
 if(a==='plan-replace'){planReplace(el.dataset.key);return;}
 if(a==='choose-plan-product'){const p=V.plan;p.overrides={...(p.overrides||{}),[el.dataset.key]:id};const agg=C.aggregate(p.selected,p.options.people,D.recipes,D.products,S.pantry,p.overrides);Object.assign(p,agg);p.quote=C.quote(agg.cart,D.products,D.settings);closeModal();render();return;}
 if(a==='plan-dish'){planDish(Number(el.dataset.index));return;}
 if(a==='choose-plan-dish'){const p=V.plan;p.selected[Number(el.dataset.index)]=id;p.overrides={};const agg=C.aggregate(p.selected,p.options.people,D.recipes,D.products,S.pantry);Object.assign(p,agg);p.quote=C.quote(p.cart,D.products,D.settings);closeModal();render();return;}
 if(a==='accept-plan'){applyPlan();return;}
 if(a==='recipe'){recipeModal(id);return;}
 if(a==='add-recipe'){const agg=C.aggregate([id],V.recipePeople,D.recipes,D.products,S.pantry);if(agg.missing.length)return;if(!Object.keys(agg.cart).length){toast(L('Все продукты уже есть дома. Покупать ничего не нужно.','Барлық өнім үйде бар. Ештеңе сатып алу қажет емес.'));return;}if(addBasket(agg.cart)){closeModal();navigate('cart');toast(L('Ингредиенты добавлены в корзину','Ингредиенттер себетке қосылды'));}return;}
 if(a==='edit-pantry'){editPantry(id);return;}
 if(a==='remove-pantry'){S.pantry=S.pantry.filter(x=>x.id!==id);V.plan=null;save();render();return;}
 if(a==='pantry-from-orders'){pantryFromOrders();return;}
 if(a==='import-order-pantry'){importPantryModal(id);return;}
 if(a==='repeat-order'){const o=S.orders.find(x=>x.id===id);if(!o)return;const b={};let missing=false;o.items.forEach(x=>{const p=pby(x.id);if(p?.active&&p.stock>=x.qty)b[x.id]=(b[x.id]||0)+x.qty;else missing=true;});if(addBasket(b)){navigate('cart');toast(missing?L('Доступные товары добавлены. Часть позиций недоступна.','Қолжетімді өнімдер қосылды. Кейбірі қолжетімсіз.'):L('Повторили по текущим ценам и остаткам.','Ағымдағы баға мен қалдық бойынша қайталанды.'));}return;}
 if(a==='cancel-order'){await cancelOrder(id);return;}
 if(a==='refresh-orders'){await refreshAccount();return;}
 if(a==='order-support'){V.supportOrder=id;navigate('support');return;}
 if(a==='tracking'){const o=S.orders.find(o=>o.id===id);openModal(L('Отслеживание заказа','Тапсырысты бақылау'),'<p class="note">'+L('Карта курьера не подключена. Ниже — только история ручных статусов тестового заказа.','Курьер картасы қосылмаған. Төменде тек сынақ тапсырысының қолмен қойылған күйлері.')+'</p>'+(o?.timeline||[]).map(x=>'<div class="spec-row"><b>'+status(x.status)+'</b><span>'+date(x.at)+'</span></div>').join(''));return;}
 if(a==='club-promo'){S.promo=el.dataset.code||'';save(false);navigate('cart');return;}
 if(a==='copy-referral'){if(!user?.referralCode)return;try{await navigator.clipboard.writeText(user.referralCode);toast(L('Код скопирован','Код көшірілді'));}catch(_){openModal(L('Ваш код','Сіздің кодыңыз'),'<input readonly value="'+e(user.referralCode)+'" aria-label="Referral code"><p class="small mt">'+L('Скопируйте код вручную.','Кодты қолмен көшіріңіз.')+'</p>');}return;}
 if(a==='notifications'){notifications();return;}
 if(a==='notifications-toggle'){S.notifications=el.checked;save();return;}
 if(a==='export-data'){await exportData();return;}
 if(a==='delete-data'){await deleteData();return;}
 if(a==='about'){about();return;}
}
async function submit(form){const data=Object.fromEntries(new FormData(form)),kind=form.dataset.form;
 if(kind==='promo'){const code=String(data.promo).trim().toUpperCase();const quote=C.quote(S.cart,D.products,D.settings,{promo:code,zone:V.checkout.zone});if(quote.promoError){toast(errText(new Error(quote.promoError)));return;}S.promo=code;save(false);render();toast(code?L('Промокод применён','Промокод қолданылды'):L('Промокод убран','Промокод алынды'));return;}
 if(kind==='plan'){V.planText=$('#plan-request').value;V.planner={...V.planner,budget:Number(data.budget),people:Number(data.people),days:Number(data.days),minutes:Number(data.minutes),meal:data.meal,vegetarian:data.vegetarian==='on',exclude:C.parseExclusions(data.exclude)};V.plan=C.makePlan(V.planner,D.products,D.recipes,D.settings,S.pantry);render();if(window.innerWidth<850)$('#plan-result').scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(kind==='address'){if(S.addresses.length>=10){toast(L('Можно сохранить до 10 адресов.','10 мекенжайға дейін сақтауға болады.'));return;}const adr={id:uid(),label:String(data.label).trim(),text:String(data.text).trim(),zone:data.zone};S.addresses.unshift(adr);V.checkout.address=adr.text;V.checkout.zone=adr.zone;save();closeModal();render();toast(L('Адрес сохранён','Мекенжай сақталды'));return;}
 if(kind==='profile'){S.name=String(data.name).trim();if(!user)S.phone=String(data.phone||'').trim();S.localProfile=true;save();const synced=user?await sync():true;render();if(synced)toast(user?L('Профиль обновлён','Профиль жаңартылды'):L('Профиль сохранён на устройстве','Профиль құрылғыда сақталды'));return;}
 if(kind==='local-login'){S.name=String(data.name).trim();S.localProfile=true;save(false);closeModal();render();return;}
 if(kind==='request-code'){
  const r=await API.request('auth/request-code',{method:'POST',body:{phone:data.phone}});V.loginPhone=data.phone;
  openModal(L('Введите одноразовый код','Бір реттік кодты енгізіңіз'),'<p class="small">'+e(data.phone)+'</p><p class="note">'+L('SMS не отправлено. Тестовый код: ','SMS жіберілмеді. Сынақ коды: ')+'<strong style="font-size:23px;letter-spacing:4px" id="demo-code">'+e(r.demoCode)+'</strong><br>'+L('Действует 5 минут. Не более 5 попыток.','5 минут жарамды. 5 әрекеттен артық емес.')+'</p><form data-form="verify-code" data-challenge="'+e(r.challengeId)+'"><label class="field">'+L('Код','Код')+'<input id="otp-code" name="code" pattern="[0-9]{6}" minlength="6" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required placeholder="000000"></label><label class="field">'+L('Код друга (при первом входе)','Дос коды (алғаш кіргенде)')+'<input name="referral" maxlength="32" value="'+e(new URLSearchParams(location.search).get('ref')?.slice(0,32)||'')+'"></label><div class="form-error"></div><button type="submit" class="btn primary block">'+L('Подтвердить','Растау')+'</button></form>');return;
 }
 if(kind==='verify-code'){
  const r=await API.request('auth/verify',{method:'POST',body:{challengeId:form.dataset.challenge,code:data.code,referral:data.referral}});API.setSession(r.csrf);
  const localCart=C.clone(S.cart),localFav=[...S.favorites],legacy=S.orders.filter(o=>o.legacy);S.cart={};S.favorites=[];S.pantry=[];S.addresses=[];S.orders=legacy;S.tickets=[];S.name='';applyUser(r.user);
  if(Object.keys(localCart).length&&confirm(L('Добавить гостевую корзину к вашему аккаунту?','Қонақ себетін аккаунтыңызға қосамыз ба?'))){addBasket(localCart);S.favorites=[...new Set([...S.favorites,...localFav])];save();await sync();}
  closeModal();await refreshAccount(false);render();toast(L('Вы вошли в тестовый аккаунт','Сынақ аккаунтына кірдіңіз'));return;
 }
 if(kind==='pantry'){
  const p=D.products.find(p=>p.ingredient===data.ingredient);if(!p||p.unit!==data.unit){toast(L('Выберите правильные единицы для продукта: ','Өнімге дұрыс бірлікті таңдаңыз: ')+amount(1,p?.unit||'g'));return;}
  if(S.pantry.length>=150){toast(L('Достигнут лимит 150 записей.','150 жазба шегіне жетті.'));return;}S.pantry.push({id:uid(),ingredient:data.ingredient,amount:Number(data.amount),unit:data.unit,expiresAt:data.expiresAt,confirmed:true});V.plan=null;save();render();toast(L('Домашний запас добавлен','Үйдегі қор қосылды'));return;
 }
 if(kind==='edit-pantry'){const x=S.pantry.find(x=>x.id===form.dataset.id);if(x){x.amount=Number(data.amount);x.expiresAt=data.expiresAt;x.confirmed=true;V.plan=null;save();closeModal();render();}return;}
 if(kind==='import-pantry'){const o=S.orders.find(o=>o.id===form.dataset.id);if(!o)return;let n=0;for(const line of o.items){if(data['use-'+line.id]!=='on')continue;const p=pby(line.id),qty=Number(data['amount-'+line.id]);if(!p||!Number.isFinite(qty)||qty<=0||qty>1000000||S.pantry.length>=150)continue;S.pantry.push({id:uid(),ingredient:p.ingredient,amount:qty,unit:p.unit,expiresAt:'',confirmed:true});n++;}if(n){V.plan=null;save();closeModal();render();toast(L('Подтверждённые запасы добавлены','Расталған қор қосылды'));}else toast(L('Выберите хотя бы один продукт.','Кемінде бір өнімді таңдаңыз.'));return;}
 if(kind==='support'){
  if(API.enabled&&!user){V.supportText=data.text;login();return;}
  const body={text:String(data.text).trim(),orderId:data.orderId||'',kind:data.kind};if(body.text.length<5)return;
  const t=API.enabled?await API.request('support',{method:'POST',body}):{...body,id:'LOCAL-T-'+uid().slice(0,8),createdAt:new Date().toISOString(),status:'open',reply:'',demo:true};S.tickets.unshift(t);V.supportText='';save(false);render();toast(API.enabled?L('Обращение сохранено на тестовом сервере','Өтініш сынақ серверінде сақталды'):L('Обращение сохранено локально, не отправлено','Өтініш жергілікті сақталды, жіберілмеді'));return;
 }
 if(kind==='checkout'){
  rememberCheckout();if(API.enabled&&!user){login();return;}if(!Object.keys(S.cart).length)return;
  const current=q();if(current.errors.length){toast(L('Проверьте остатки товаров.','Өнім қалдығын тексеріңіз.'));return;}
  if(current.promoError){toast(errText(new Error(current.promoError)));return;}
  const payload={cart:C.clone(S.cart),promo:S.promo,bonus:S.bonus,zone:data.zone,address:String(data.address).trim(),slot:data.slot,comment:String(data.comment||'').trim(),replacements:data.replacements,payment:'test',expectedTotal:current.total};
  const fingerprint=JSON.stringify(payload),key=S.pendingOrder?.fingerprint===fingerprint?S.pendingOrder.key:uid();S.pendingOrder={fingerprint,key};save(false);V.busy=true;
  try{
   let order;
   if(API.enabled){await sync();order=await API.request('orders',{method:'POST',body:{...payload,idempotencyKey:key}});}
   else{order={id:'LOCAL-'+uid().slice(0,8).toUpperCase(),createdAt:new Date().toISOString(),status:'created',items:C.clone(current.lines),quote:C.clone(current),address:payload.address,slot:payload.slot,comment:payload.comment,replacements:payload.replacements,paymentStatus:'not_charged',demo:true,timeline:[{status:'created',at:new Date().toISOString()}]};S.balance=Math.max(0,S.balance-current.bonus);}
   S.orders=[order,...S.orders.filter(x=>x.id!==order.id)];S.cart={};S.promo='';S.bonus=0;S.pendingOrder=null;save(false);if(API.enabled)await refreshCatalogue();V.busy=false;navigate('orders');toast(L('Тестовый заказ создан. Деньги не списаны.','Сынақ тапсырысы жасалды. Ақша алынбады.'));
  }catch(err){V.busy=false;if(err.message==='price_changed'||err.message.startsWith('stock:')){await refreshCatalogue().catch(()=>{});render();}errorBox($('#checkout-error'),err);throw err;}finally{V.busy=false;}return;
 }
}
// Global event delegation: no inline JavaScript or untrusted HTML attributes.
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;if(el.disabled)return;if(el.matches('input[type=checkbox]'))return;event.preventDefault();action(el).catch(err=>toast(errText(err)));});
document.addEventListener('submit',async event=>{const f=event.target;if(!f.matches('form[data-form]'))return;event.preventDefault();if(f.dataset.busy==='1')return;f.dataset.busy='1';const buttons=[...f.querySelectorAll('button[type=submit]')],external=f.id?[...document.querySelectorAll('button[form="'+f.id+'"]')]:[];[...buttons,...external].forEach(b=>b.disabled=true);try{await submit(f);}catch(err){errorBox($('.form-error',f),err);}finally{f.dataset.busy='0';[...buttons,...external].forEach(b=>b.disabled=false);}});
let searchTimer;
document.addEventListener('input',event=>{const el=event.target;if(el.id==='global-search'){V.query=el.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{V.view='catalog';history.replaceState(null,'','#catalog');render();},200);}if(el.id==='plan-request')V.planText=el.value;if(el.closest('#checkout-form'))rememberCheckout();if(el.name==='text'&&el.closest('[data-form=support]'))V.supportText=el.value;});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.action&&el.matches('input[type=checkbox]')){action(el).catch(err=>toast(errText(err)));return;}if(el.dataset.filter){const k=el.dataset.filter;V[k]=['sale','available'].includes(k)?el.checked:['min','max'].includes(k)?Math.max(0,Math.min(100000,Number(el.value)||0)):el.value;render();return;}if(el.dataset.recipeFilter){const k=el.dataset.recipeFilter;V[k]=k==='recipeVeg'?el.checked:k==='recipeMeal'?el.value:Number(el.value);V.recipePeople=Math.max(1,Math.min(8,V.recipePeople||1));V.recipeBudget=Math.max(500,V.recipeBudget||500);render();return;}if(el.closest('#checkout-form')){rememberCheckout();if(el.name==='zone')render();}if(el.closest('#pantry-form')&&el.name==='ingredient'){const p=D.products.find(p=>p.ingredient===el.value);if(p){const f=el.form;f.elements.unit.value=p.unit;f.elements.amount.value=p.pack;}}});
document.addEventListener('load',event=>{if(event.target.matches?.('.photo img'))event.target.classList.add('loaded');},true);
document.addEventListener('error',event=>{if(event.target.matches?.('.photo img'))event.target.style.display='none';},true);
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const rect=event.target.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
window.addEventListener('hashchange',()=>{const [view,id]=(location.hash.slice(1)||'home').split('/');if(view==='product'&&pby(id)){V.selectedProduct=id;V.view='product';render();}else if(pages[view]&&V.view!==view){V.view=view;render();}});
async function init(){
 migrate();safeArrays();document.body.dataset.theme=S.theme;
 try{const d=await API.init();if(d){D={...D,...d};try{const u=await API.request('me');applyUser(u);await refreshAccount(false);}catch(err){if(err.status!==401)toast(errText(err));}}}catch(err){$('#app').innerHTML='<div class="boot"><h1>KEREK</h1><p>'+e(errText(err))+'</p><button class="btn primary" data-action="reload">'+L('Обновить страницу','Бетті жаңарту')+'</button></div>';document.querySelector('[data-action=reload]').onclick=()=>location.reload();return;}
 // Do not silently delete stale server items: quantity checks occur at checkout.
 const [view,id]=(location.hash.slice(1)||'home').split('/');V.view=pages[view]?view:'home';if(view==='product')V.selectedProduct=id;
 write();render();
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.KEREK_STANDALONE)navigator.serviceWorker.register('sw.js').catch(()=>{});
 setInterval(()=>{if(API.enabled&&user&&V.view==='orders'&&document.visibilityState==='visible')refreshAccount(false).catch(()=>{});},30000);
}
window.KerekApp={get state(){return S;},get view(){return V;},get data(){return D;},navigate,render,refreshAccount};
init();
})();
</script></body></html>
