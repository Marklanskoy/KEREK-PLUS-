.splash-halo{position:absolute;inset:18%;border-radius:50%;background:#ffd98a;filter:blur(35px);opacity:.5;animation:kerek-breathe 3.2s ease-in-out infinite}
.splash-orbit,.splash-orbit-secondary{position:absolute;inset:3px;border-radius:50%;pointer-events:none;z-index:0;animation:kerek-orbit 5.5s linear infinite}
.splash-orbit{background:conic-gradient(from 0deg,transparent 0%,transparent 47%,#ffd494 72%,#ff9813 78%,transparent 84%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1.7px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 1.7px),#000 calc(100% - 1px));opacity:.86}
.splash-orbit-secondary{inset:17px;animation-duration:8s;animation-direction:reverse;opacity:.38;border:1px solid #f1bd77}
.splash-logo-wrap{position:relative;display:grid;place-items:center;width:176px;height:176px;max-width:55vw;max-height:55vw;z-index:1;border-radius:36px;filter:drop-shadow(0 21px 28px rgba(214,95,5,.17));animation:kerek-logo-arrive .85s cubic-bezier(.16,1,.3,1) both}
.splash-art{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;transform:none;filter:none}
.splash-sheen{position:absolute;z-index:2;inset:4%;border-radius:30px;overflow:hidden;pointer-events:none}
.splash-sheen::after{content:'';position:absolute;inset:-45%;transform:translateX(-145%) rotate(22deg);background:linear-gradient(90deg,transparent 38%,rgba(255,255,255,.06) 45%,rgba(255,255,255,.38) 51%,rgba(255,255,255,.06) 57%,transparent 64%);animation:kerek-sheen 2.5s 0.5s ease-in-out infinite}
.splash-title{font-size:clamp(29px,7vw,40px);font-weight:880;letter-spacing:-1.6px;line-height:1.1;margin:0;color:var(--splash-text);animation:kerek-reveal .7s .18s both}
.splash-title span{background:linear-gradient(108deg,#f45d00,#ffb400);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash-divider{height:2px;width:78px;border-radius:3px;background:linear-gradient(90deg,transparent,#ffb344,transparent);margin:19px 0 18px;animation:kerek-line .85s .32s both}
.splash-tagline{font-size:13px;font-weight:550;letter-spacing:.14em;text-transform:uppercase;color:var(--splash-muted);margin:0 0 47px;animation:kerek-reveal .65s .3s both}
.splash-status{margin:0;min-height:22px;font-size:13px;line-height:1.6;color:var(--splash-muted);animation:kerek-reveal .65s .52s both}
.splash-dots{display:flex;gap:7px;justify-content:center;align-items:center;margin-top:15px;height:8px}
.splash-dots i{width:6px;height:6px;border-radius:50%;background:#f79100;animation:kerek-dot 1.24s ease-in-out infinite;opacity:.38}
.splash-dots i:nth-child(2){animation-delay:.16s}.splash-dots i:nth-child(3){animation-delay:.32s}
.splash-assist{position:absolute;top:calc(100% + 37px);width:100%;font-size:11px;line-height:1.55;color:var(--splash-muted);visibility:hidden;animation:kerek-help 0s 6s forwards}
.splash-assist a{color:inherit;text-decoration:underline;text-underline-offset:3px;display:inline-block;padding:10px 8px}
#kerek-splash.splash-ready .splash-status{color:#b76a00}
#kerek-splash.splash-leaving{opacity:0;visibility:hidden;pointer-events:none}
#kerek-splash.splash-leaving .splash-content{transform:translateY(-28px) scale(1.018);transition:transform .42s cubic-bezier(.22,1,.36,1)}
@keyframes kerek-logo-arrive{0%{opacity:0;transform:translateY(32px) scale(.68)}62%{opacity:1;transform:translateY(-4px) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes kerek-reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes kerek-line{from{opacity:0;transform:scaleX(.05)}to{opacity:1;transform:scaleX(1)}}
@keyframes kerek-orbit{to{transform:rotate(360deg)}}
@keyframes kerek-breathe{0%,100%{opacity:.32;transform:scale(.94)}50%{opacity:.55;transform:scale(1.1)}}
@keyframes kerek-sheen{0%,30%{transform:translateX(-145%) rotate(22deg)}66%,100%{transform:translateX(145%) rotate(22deg)}}
@keyframes kerek-dot{0%,80%,100%{opacity:.26;transform:scale(.75)}40%{opacity:1;transform:scale(1.1)}}
@keyframes kerek-float{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-17px);opacity:.7}}
@keyframes kerek-atmosphere{from{transform:translate(0,0)}to{transform:translate(9%,5%)}}
@keyframes kerek-help{to{visibility:visible}}
body[data-theme=dark] #kerek-splash{--splash-bg:#201c1a;--splash-text:#f7efe4;--splash-muted:#e1bfa0}
body[data-theme=dark] .splash-title span{background:linear-gradient(100deg,#ff8c17,#ffd052);-webkit-background-clip:text;background-clip:text;color:transparent}
body[data-theme=dark] .splash-orbit-secondary{border-color:#905b2e}
@media(prefers-color-scheme:dark){body:not([data-theme]) #kerek-splash{--splash-bg:#201c1a;--splash-text:#f7efe4;--splash-muted:#e1bfa0}}
@media(max-width:600px){.brand img.brand-icon{width:34px;height:34px}.brand-wordmark{font-size:23px}.brand-wordmark small{font-size:8px;letter-spacing:2.6px}.header-top>.brand{gap:7px}.splash-emblem{width:226px;height:226px;margin-bottom:12px}.splash-logo-wrap{width:160px;height:160px}.splash-tagline{margin-bottom:42px}}
@media(max-width:360px){.brand img.brand-icon{width:31px;height:31px}.brand-wordmark{font-size:21px}.header-top>.brand{gap:5px}.header .mobile-address{max-width:70px}.header .mobile-address span{max-width:55px}.splash-emblem{width:208px;height:208px}.splash-logo-wrap{width:151px;height:151px}.splash-title{font-size:30px}}
@media(max-height:550px){.splash-content{transform:none}.splash-emblem{width:154px;height:154px;margin-bottom:6px}.splash-logo-wrap{width:108px;height:108px}.splash-tagline{margin-bottom:8px}.splash-divider{margin:6px 0}.splash-assist{position:static;margin-top:5px}}
@media(prefers-reduced-motion:reduce){
 #kerek-splash{transition:none}.splash-orbit,.splash-orbit-secondary,.splash-halo,.splash-logo-wrap,.splash-sheen::after,.splash-title,.splash-divider,.splash-tagline,.splash-status,.splash-dots i,.splash-atmosphere i,#kerek-splash::before,#kerek-splash::after{animation:none!important;transform:none!important}
 .splash-title,.splash-divider,.splash-tagline,.splash-status,.splash-logo-wrap{opacity:1}
 .splash-dots i{opacity:.6}.splash-assist{animation:none;visibility:visible}
}

const routeFields=['view','selectedProduct','query','category','subcategory','brand','sort','sale','available','min','max','profile'];
function routeHash(){return '#'+V.view+(V.view==='product'?'/'+encodeURIComponent(V.selectedProduct||''):'');}
function routeSnapshot(){const state={kerekRoute:1,scroll:Math.max(0,window.scrollY||0),focus:focusIdentity(document.activeElement)};for(const k of routeFields)state[k]=V[k];return state;}
function saveRoute(){if(!started||routeRestoring)return;try{history.replaceState(routeSnapshot(),'',location.hash||routeHash());}catch{}}
function navigate(view,opts={}){clearTimeout(searchTimer);
 rememberCheckout();rememberSupport();flushDrafts();closeModal();if(!opts.savedRoute)saveRoute();
 const same=V.view===view;V.view=Object.hasOwn(pages,view)?view:'home';if(opts.clearQuery)V.query='';if(V.view!=='product')V.selectedProduct=null;
 const hash=routeHash(),st={...routeSnapshot(),scroll:opts.scroll===false?(window.scrollY||0):0,focus:null};
 try{if(hash===location.hash||opts.replace)history.replaceState(st,'',hash);else history.pushState(st,'',hash);}catch{}
 currentRouteKey=hash;render({preserveFocus:!!opts.keepFocus});if(opts.scroll!==false)window.scrollTo({top:0,behavior:'instant'});
 if(!opts.keepFocus)$('#main')?.focus({preventScroll:true});
 if(!opts.skipRefresh&&['orders','club','support'].includes(V.view)&&API.enabled&&user)refreshAccount(false).catch(err=>toast(errText(err)));
}
function goProduct(id){if(!pby(id))return;saveRoute();if(Store.writable){S.seen=[id,...S.seen.filter(x=>x!==id)].slice(0,12);save(false);}V.selectedProduct=id;navigate('product',{savedRoute:true});}
function restoreRoute(event){
 if(!started)return;rememberCheckout();rememberSupport();try{flushDrafts();}catch(err){toast(errText(err));}closeModal();
 const [rawView,rawId]=(location.hash.slice(1)||'home').split('/');let id='';try{id=decodeURIComponent(rawId||'');}catch{}
 const st=event?.state||history.state,view=Object.hasOwn(pages,rawView)?rawView:'home';routeRestoring=true;
 if(st?.kerekRoute===1&&st.view===view){for(const k of routeFields)if(Object.hasOwn(st,k))V[k]=st[k];}
 V.view=view;V.selectedProduct=view==='product'?id:null;currentRouteKey=location.hash;render({preserveFocus:false});routeRestoring=false;
 requestAnimationFrame(()=>{if(st?.focus)restoreFocus(st.focus);else $('#main')?.focus({preventScroll:true});window.scrollTo({top:Math.max(0,Math.min(Number(st?.scroll)||0,document.documentElement.scrollHeight)),behavior:'instant'});});
}

function addProduct(id,delta=1){
 if(V.busy)return;Store.assertWritable();const p=pby(id),old=Number(S.cart[id]||0),next=old+delta;
 if(delta>0&&(!p||!p.active||next>Math.min(Number(p.stock)||0,99))){toast(L('Достигнут доступный остаток.','Қолжетімді қалдыққа жетті.'));return;}
 if(next<=0){removeItems([id]);return;}if(delta<0&&!old)return;
 S.cart[id]=next;cartChanged();save();render();announceCart();
}
function addBasket(cart,replace=false){const merged=replace?{}:C.clone(S.cart);let shortage=false;for(const [id,qty] of Object.entries(cart)){const p=pby(id);if(!p||!p.active||p.stock<=0){shortage=true;continue;}const n=(merged[id]||0)+qty;if(n>Math.min(99,p.stock))shortage=true;merged[id]=Math.min(99,p.stock,n);}if(shortage){toast(L('Не добавлено: выбранное количество превышает остаток. Проверьте корзину.','Қосылмады: таңдалған мөлшер қалдықтан асады. Себетті тексеріңіз.'));return false;}S.cart=merged;S.pendingOrder=null;save();return true;}
async function refreshCatalogue(){if(!API.enabled)return;const d=await API.request('bootstrap');D={...D,...d};}
async function refreshAccount(visible=true){if(API.enabled&&user&&!V.busy){const epoch=sessionEpoch,revision=S.revision;const [u,orders,tickets,catalog]=await Promise.all([API.request('me'),API.request('orders'),API.request('support'),API.request('bootstrap')]);if(epoch!==sessionEpoch||!user||V.busy||revision!==S.revision)return false;
 user=u;S.balance=u.balance;S.ledger=u.ledger;S.orders=[...orders,...S.orders.filter(o=>o.legacy)];S.tickets=[...tickets,...S.tickets.filter(t=>t.localDraft)];D={...D,...catalog};save(false);if(V.unsavedReceipt&&orders.some(o=>o.id===V.unsavedReceipt.id))V.unsavedReceipt=null;render();if(visible)toast(L('Данные обновлены','Деректер жаңартылды'));return true;}else if(visible)toast(L('В локальном режиме нет удалённых обновлений.','Жергілікті режимде сервер жаңартуы жоқ.'));return false;}

function applyPlan(asDraft=false){
 Store.assertWritable();const p=V.plan;if(!p||p.error)return;
 const agg=C.aggregate(p.selected,p.options.people,D.recipes,D.products,S.pantry,p.overrides||{}),order=C.orderReadiness(agg.cart,D.products,D.settings,{zone:V.checkout.zone});
 if(agg.missing.length||order.quote.errors.length||order.quote.total>p.options.budget||order.empty||(!order.canOrder&&!asDraft)){Object.assign(p,agg,{quote:order.quote});render();toast(L('Проверьте условия подборки. Заказ пока не готов.','Таңдау шарттарын тексеріңіз. Тапсырыс дайын емес.'));return;}
 if(asDraft&&!confirm(L('Перенести список, который пока нельзя оформить? Минимум нужно дополнить только нужными товарами.','Әлі рәсімделмейтін тізімді көшіреміз бе? Тек қажет өніммен толықтырыңыз.')))return;
 if(cartCount()&&!confirm(L('Заменить текущую корзину продуктами из плана?','Ағымдағы себетті жоспар өнімдерімен ауыстырамыз ба?')))return;
 const old=S;try{S={...C.clone(S),cart:agg.cart,promo:'',bonus:0,pendingOrder:null,cartBudget:{amount:p.options.budget,source:'recipe'}};save();undo=null;V.plan=null;navigate('cart');toast(asDraft?L('Список перенесён для дополнения; минимум ещё не достигнут.','Тізім толықтыру үшін көшірілді; минимум жиналмады.'):L('Корзина собрана. Итог включает доставку.','Себет жиналды. Қорытындыға жеткізу кіреді.'));}catch(err){S=Store.latest()||old;throw err;}
}

function readBackup(payload){
 let values=payload?.format==='kerek-recovery'?payload.values:payload&&Object.keys(payload).some(k=>k==='kerek_v3'||k.startsWith('kerek_3_2:'))?payload:null;
 let v=payload?.format==='kerek-backup'?payload.state:payload;
 if(values){
  const currentKey=Object.keys(values).filter(k=>k.startsWith('kerek_3_2:')&&!k.includes(':before-'));
  if(values[Store.key])v=JSON.parse(values[Store.key]);
  else if(currentKey.length===1)v=JSON.parse(values[currentKey[0]]);
  else if(values.kerek_v3){v=JSON.parse(values.kerek_v3);v.autopilot=window.KerekAutopilotCore.migrate(JSON.parse(values.kerek_autopilot_v1||'{}'),JSON.parse(values.kerek_autopilot_manual_v1||'[]'));}
  else throw new Error('invalid_backup');
 }
Safe.validateState(v);
if(!v||![3,32].includes(v.version)||!Array.isArray(v.orders)||!Array.isArray(v.favorites)||!Array.isArray(v.pantry)||!v.cart||typeof v.cart!=='object'||Array.isArray(v.cart))throw new Error('invalid_backup');
 for(const k of ['orders','tickets','addresses','pantry','favorites','ledger','seen'])if(v[k]!==undefined&&(!Array.isArray(v[k])||v[k].length>10000))throw new Error('invalid_backup');
 const safe={...C.clone(defaults)};for(const k of Object.keys(defaults))if(v[k]!==undefined&&!['revision','version'].includes(k))safe[k]=C.clone(v[k]);
 safe.pendingOrder=null; // Never replay an in-flight request imported from another session.
 safe.autopilot=v.autopilot?window.KerekAutopilotCore.validate(C.clone(v.autopilot)):window.KerekAutopilotCore.defaults();return safe;
}
