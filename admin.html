.splash-halo{position:absolute;inset:18%;border-radius:50%;background:#ffd98a;filter:blur(35px);opacity:.5;animation:kerek-breathe 3.2s ease-in-out infinite}
.splash-orbit,.splash-orbit-secondary{position:absolute;inset:3px;border-radius:50%;pointer-events:none;z-index:0;animation:kerek-orbit 5.5s linear infinite}
.splash-orbit{background:conic-gradient(from 0deg,transparent 0%,transparent 47%,#ffd494 72%,#ff9813 78%,transparent 84%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1.7px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 1.7px),#000 calc(100% - 1px));opacity:.86}
.splash-orbit-secondary{inset:17px;animation-duration:8s;animation-direction:reverse;opacity:.38;border:1px solid #f1bd77}
.splash-logo-wrap{position:relative;display:grid;place-items:center;width:176px;height:176px;max-width:55vw;max-height:55vw;z-index:1;border-radius:36px;filter:drop-shadow(0 21px 28px rgba(214,95,5,.17));animation:kerek-logo-arrive .85s cubic-bezier(.16,1,.3,1) both}
.splash-art{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;transform:none;filter:none}
.splash-sheen{position:absolute;z-index:2;inset:4%;border-radius:30px;overflow:hidden;pointer-events:none}
.splash-sheen::after{content:'';position:absolute;inset:-45%;transform:translateX(-145%) rotate(22deg);background:linear-gradient(90deg,transparent 38%,rgba(255,255,255,.06) 45%,rgba(255,255,255,.38) 51%,rgba(255,255,255,.06) 57%,transparent 64%);animation:kerek-sheen 2.5s 0.5s ease-in-out infinite}
.splash-title{font-size:clamp(29px,7vw,40px);font-weight:880;letter-spacing:-1.6px;line-height:1.1;margin:0;color:var(--splash-text);animation:kerek-reveal .7s .18s both}
.splash-title span{background:linear-gradient(108deg,#f45d00,#ffb400);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash-divider{height:2px;width:78px;border-radius:3px;background:linear-gradient(90deg,transparent,#ffb344,transparent);margin:19px 0 18px;animation:kerek-line .85s .32s both}
.splash-tagline{font-size:13px;font-weight:550;letter-spacing:.14em;text-transform:uppercase;color:var(--splash-muted);margin:0 0 47px;animation:kerek-reveal .65s .3s both}
.splash-status{margin:0;min-height:22px;font-size:13px;line-height:1.6;color:var(--splash-muted);animation:kerek-reveal .65s .52s both}
.splash-dots{display:flex;gap:7px;justify-content:center;align-items:center;margin-top:15px;height:8px}
.splash-dots i{width:6px;height:6px;border-radius:50%;background:#f79100;animation:kerek-dot 1.24s ease-in-out infinite;opacity:.38}
.splash-dots i:nth-child(2){animation-delay:.16s}.splash-dots i:nth-child(3){animation-delay:.32s}
.splash-assist{position:absolute;top:calc(100% + 37px);width:100%;font-size:11px;line-height:1.55;color:var(--splash-muted);visibility:hidden;animation:kerek-help 0s 6s forwards}
.splash-assist a{color:inherit;text-decoration:underline;text-underline-offset:3px;display:inline-block;padding:10px 8px}
#kerek-splash.splash-ready .splash-status{color:#b76a00}
#kerek-splash.splash-leaving{opacity:0;visibility:hidden;pointer-events:none}
#kerek-splash.splash-leaving .splash-content{transform:translateY(-28px) scale(1.018);transition:transform .42s cubic-bezier(.22,1,.36,1)}
@keyframes kerek-logo-arrive{0%{opacity:0;transform:translateY(32px) scale(.68)}62%{opacity:1;transform:translateY(-4px) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes kerek-reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes kerek-line{from{opacity:0;transform:scaleX(.05)}to{opacity:1;transform:scaleX(1)}}
@keyframes kerek-orbit{to{transform:rotate(360deg)}}
@keyframes kerek-breathe{0%,100%{opacity:.32;transform:scale(.94)}50%{opacity:.55;transform:scale(1.1)}}
@keyframes kerek-sheen{0%,30%{transform:translateX(-145%) rotate(22deg)}66%,100%{transform:translateX(145%) rotate(22deg)}}
@keyframes kerek-dot{0%,80%,100%{opacity:.26;transform:scale(.75)}40%{opacity:1;transform:scale(1.1)}}
@keyframes kerek-float{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-17px);opacity:.7}}
@keyframes kerek-atmosphere{from{transform:translate(0,0)}to{transform:translate(9%,5%)}}
@keyframes kerek-help{to{visibility:visible}}
body[data-theme=dark] #kerek-splash{--splash-bg:#201c1a;--splash-text:#f7efe4;--splash-muted:#e1bfa0}

@media(max-width:600px){.brand img.brand-icon{width:34px;height:34px}.brand-wordmark{font-size:23px}.brand-wordmark small{font-size:8px;letter-spacing:2.6px}.header-top>.brand{gap:7px}.splash-emblem{width:226px;height:226px;margin-bottom:12px}.splash-logo-wrap{width:160px;height:160px}.splash-tagline{margin-bottom:42px}}
@media(max-width:360px){.brand img.brand-icon{width:31px;height:31px}.brand-wordmark{font-size:21px}.header-top>.brand{gap:5px}.header .mobile-address{max-width:70px}.header .mobile-address span{max-width:55px}.splash-emblem{width:208px;height:208px}.splash-logo-wrap{width:151px;height:151px}.splash-title{font-size:30px}}
@media(max-height:550px){.splash-content{transform:none}.splash-emblem{width:154px;height:154px;margin-bottom:6px}.splash-logo-wrap{width:108px;height:108px}.splash-tagline{margin-bottom:8px}.splash-divider{margin:6px 0}.splash-assist{position:static;margin-top:5px}}
@media(prefers-reduced-motion:reduce){
 #kerek-splash{transition:none}.splash-orbit,.splash-orbit-secondary,.splash-halo,.splash-logo-wrap,.splash-sheen::after,.splash-title,.splash-divider,.splash-tagline,.splash-status,.splash-dots i,.splash-atmosphere i,#kerek-splash::before,#kerek-splash::after{animation:none!important;transform:none!important}
 .splash-title,.splash-divider,.splash-tagline,.splash-status,.splash-logo-wrap{opacity:1}
 .splash-dots i{opacity:.6}.splash-assist{animation:none;visibility:visible}
}

/* KEREK PLUS 3.6 — motion language. Motion communicates state, never delays a financial/order action. */
:root{--km-fast:140ms;--km-normal:230ms;--km-ease:cubic-bezier(.2,.8,.2,1)}
/* Interactive affordances: hover only on devices that have a real hover pointer. */
@media(hover:hover) and (pointer:fine){
 .product,.category-tile,.recipe,.guide-step{transition:transform var(--km-normal) var(--km-ease),border-color var(--km-normal),box-shadow var(--km-normal) var(--km-ease)}
 .product:hover,.product:focus-within{transform:translateY(-4px);box-shadow:0 12px 30px rgba(94,60,22,.12);border-color:rgba(233,145,36,.32)}
 .category-tile:hover,.category-tile:focus-visible{transform:translateY(-3px);border-color:var(--orange);box-shadow:0 9px 25px rgba(210,127,18,.12)}
 .recipe:hover,.recipe:focus-within,.guide-step:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(80,50,12,.10)}
 .product .photo img,.recipe .photo img{transition:transform 390ms var(--km-ease),opacity 200ms ease}
 .product:hover .photo img,.recipe:hover .photo img{transform:scale(1.045)}
 .product .photo-fallback,.recipe .photo-fallback{transition:transform 360ms var(--km-ease)}
 .product:hover .photo-fallback,.recipe:hover .photo-fallback{transform:scale(1.055)}
 .btn:hover:not(:disabled),.add-btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.025)}
 .icon-btn:hover:not(:disabled),.fav-btn:hover:not(:disabled){transform:translateY(-1px)}
 .chip:hover:not(:disabled),.filter-cats button:hover:not(:disabled),.bottom-nav button:hover:not(:disabled){filter:brightness(1.04)}
}
.btn,.add-btn,.icon-btn,.fav-btn,.chip,.filter-cats button,.bottom-nav button,.profile-nav button{
 transition:transform var(--km-fast) var(--km-ease),background-color var(--km-normal) ease,box-shadow var(--km-normal) ease,color var(--km-fast) ease,filter var(--km-fast) ease;
}
button:active:not(:disabled){transform:scale(.965)}
.qty{transition:background-color var(--km-fast) ease,box-shadow var(--km-normal) ease}
.qty:focus-within{box-shadow:0 0 0 2px rgba(255,146,0,.3)}
.cart-budget,.summary,.savings-card,.cart-issues{transition:border-color var(--km-normal) ease,background-color var(--km-normal) ease}
.free-progress>span,.ka-track>span,progress{transition:width 360ms var(--km-ease)}
/* Motion for overlays that do not block data entry or hold route navigation. */
dialog[open]{animation:km-dialog-in 260ms var(--km-ease) both}
dialog[open]::backdrop{animation:km-backdrop-in 220ms ease-out both}
#toast.show{animation:km-toast-in 240ms var(--km-ease) both}
#toast.show button:focus-visible{outline-offset:2px}
.km-cart-orb{position:fixed;z-index:80;pointer-events:none;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:radial-gradient(circle at 36% 28%,#fff5c5 0%,#ffdc62 34%,#ff8b11 80%);box-shadow:0 0 0 4px rgba(255,181,57,.18),0 0 14px rgba(255,161,28,.38);will-change:transform,opacity}
@keyframes km-dialog-in{from{opacity:0;transform:translateY(10px) scale(.988)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes km-backdrop-in{from{background-color:rgba(0,0,0,0)}to{background-color:rgba(0,0,0,.45)}}
@keyframes km-toast-in{from{opacity:0;transform:translate(-50%,15px) scale(.97)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
/* Do not animate user-preferred reduced motion, and do not force smooth scroll. */
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}
 .km-cart-orb{display:none!important}
}

Z0-9_-]{1,50}" required></label><label class="field full-width">Фотография JPEG / PNG / WebP<input type="file" id="product-image-file" accept="image/jpeg,image/png,image/webp"><span class="small" id="image-result">'+e(p.image||'Не загружена')+'</span></label><label class="field full-width">Состав (только проверенный)<textarea name="composition" maxlength="2000">'+e(p.composition||'')+'</textarea></label><label class="field full-width">Хранение (только проверенные данные)<textarea name="storage" maxlength="1000">'+e(p.storage||'')+'</textarea></label><label class="field full-width">Описание<textarea name="description" maxlength="2000">'+e(p.description)+'</textarea></label></div><label class="check"><input type="checkbox" name="active" '+(p.active?'checked':'')+'>Показывать в каталоге</label><p class="note">Снимите отметку для архивирования. Товар остаётся в истории заказов. Ключ ингредиента используется рецептами: например milk, rice, chicken.</p><button class="btn primary block" type="submit">Сохранить товар</button></form>');}
function orderModal(id){const o=O.orders.find(o=>o.id===id);if(!o)return;const next={created:'assembling',assembling:'ready',ready:'delivering',delivering:'delivered'}[o.status];modal(e(o.id),'<span class="pill">'+status[o.status]+'</span><p class="note mt">ТЕСТ. Деньги не списаны, реального курьера нет. Статус меняется вручную.</p><p><b>'+e(o.address)+'</b><br>'+e(o.slot)+'</p><p class="small">Комментарий: '+e(o.comment||'нет')+'<br>Замены: '+e(o.replacements)+'</p>'+o.items.map(i=>'<div class="spec-row"><span>'+e(i.name)+' × '+i.qty+'</span><b>'+money(i.price*i.qty)+'</b></div>').join('')+'<div class="summary-row total"><b>Итого</b><b>'+money(o.quote.total)+'</b></div><div class="form-actions">'+(next?button('order-status','Следующий статус: '+status[next],'data-id="'+e(o.id)+'" data-status="'+next+'"','primary'):'')+(['created','assembling','ready'].includes(o.status)?button('order-status','Отменить и вернуть остатки','data-id="'+e(o.id)+'" data-status="cancelled"','danger'):'')+'</div><h3 class="mt">История</h3>'+o.timeline.map(t=>'<div class="spec-row"><b>'+status[t.status]+'</b><span>'+dt(t.at)+'</span></div>').join(''));}
function promoModal(id){const p=D.settings.promos.find(p=>p.code===id)||{code:'',percent:10,maxDiscount:2000,minSubtotal:1000,endsAt:'',active:true};modal('Настройка промокода','<form data-form="promo" data-original="'+e(id||'')+'"><label class="field">Код<input name="code" value="'+e(p.code)+'" pattern="[A-Z0-9_-]{2,40}" required '+(id?'readonly':'')+'></label><div class="form-grid">'+[['percent','Скидка, %',90],['maxDiscount','Максимальная скидка, ₸',100000],['minSubtotal','Минимум товаров, ₸',1000000]].map(([k,n,max])=>'<label class="field">'+n+'<input name="'+k+'" type="number" min="0" max="'+max+'" required value="'+p[k]+'"></label>').join('')+'<label class="field">Действует до<input name="endsAt" type="date" value="'+e(p.endsAt)+'"></label></div><label class="check"><input name="active" type="checkbox" '+(p.active?'checked':'')+'>Активен</label><button type="submit" class="btn primary block">Сохранить</button></form>');}
function zoneModal(id){const z=D.settings.zones.find(z=>z.id===id)||{id:'zone-'+Date.now().toString(36),name:'',fee:990,enabled:true};modal('Тарифная зона','<form data-form="zone" data-original="'+e(id||'')+'"><label class="field">ID<input name="id" value="'+e(z.id)+'" pattern="[a-z0-9_-]{1,40}" '+(id?'readonly':'')+' required></label><label class="field">Название<input name="name" value="'+e(z.name)+'" minlength="2" maxlength="100" required></label><label class="field">Доставка, ₸<input name="fee" type="number" min="0" max="100000" value="'+z.fee+'" required></label><label class="check"><input name="enabled" type="checkbox" '+(z.enabled?'checked':'')+'>Включена</label><button type="submit" class="btn primary block">Сохранить</button></form>');}
function categoryModal(id){const c=D.categories.find(c=>c.id===id)||{id:'category-'+Date.now().toString(36),name:'',name_kk:'',icon:'bag',image:'hero'};modal('Категория','<form data-form="category" data-original="'+e(id||'')+'"><label class="field">ID<input name="id" value="'+e(c.id)+'" '+(id?'readonly':'')+' pattern="[a-z0-9_-]{1,40}" required></label><label class="field">Название RU<input name="name" value="'+e(c.name)+'" minlength="2" maxlength="80" required></label><label class="field">Название ҚАЗ<input name="name_kk" value="'+e(c.name_kk)+'" minlength="2" maxlength="80" required></label><button type="submit" class="btn primary block">Сохранить</button></form>');}
async function doAction(el){const a=el.dataset.action,id=el.dataset.id;
 if(a==='close'){close();return;}
 if(a==='tab'){tab=id;if(tab==='audit')A=await API.request('admin/audit');render();return;}
 if(a==='refresh'){await refresh();toast('Данные обновлены');return;}
 if(a==='logout'){await API.request('auth/logout',{method:'POST',body:{}});API.setSession('');user=null;close();render();return;}
 if(a==='new-product'||a==='edit-product'){productModal(a==='edit-product'?id:null);return;}
 if(a==='order'){orderModal(id);return;}
 if(a==='order-status'){if(!confirm('Изменить статус ТЕСТОВОГО заказа на «'+status[el.dataset.status]+'»?'))return;await API.request('admin/orders/'+encodeURIComponent(id)+'/status',{method:'POST',body:{status:el.dataset.status}});await refresh();orderModal(id);toast('Статус сохранён');return;}
 if(a==='new-promo'||a==='edit-promo'){promoModal(id);return;}
 if(a==='new-zone'||a==='edit-zone'){zoneModal(id);return;}
 if(a==='new-category'||a==='edit-category'){categoryModal(id);return;}
}
async function saveSettings(settings){await API.request('admin/settings',{method:'PUT',body:settings});}
async function submit(f){const v=Object.fromEntries(new FormData(f)),kind=f.dataset.form;
 if(kind==='login'){const r=await API.request('auth/admin',{method:'POST',body:{username:v.username,password:v.password}});API.setSession(r.csrf);user=r.user;await refresh();return;}
 if(kind==='product'){
  const base=D.products.find(p=>p.id===f.dataset.original)||{emoji:'🛍️',popularity:0,demo:true,allergens:[]};
  const body={...base,...v,price:Number(v.price),oldPrice:Number(v.oldPrice),stock:Number(v.stock),pack:Number(v.pack),active:v.active==='on',image:draftImage,composition:v.composition||null,storage:v.storage||null};
  await API.request('admin/products/'+encodeURIComponent(body.id),{method:'PUT',body});close();await refresh();toast('Товар сохранён');return;
 }
 if(kind==='settings'){const s={...D.settings};for(const k of ['minOrder','deliveryFee','freeDeliveryFrom','bonusRate','maxBonusPercent','referralReward'])s[k]=Number(v[k]);s.slots=v.slots.split(',').map(x=>x.trim()).filter(Boolean);if(s.slots.some(x=>!/^\d{2}:\d{2}–\d{2}:\d{2}$/.test(x)))throw new Error('Интервалы должны иметь вид 10:00–12:00 (длинное тире).');await saveSettings(s);await refresh();toast('Правила сохранены');return;}
 if(kind==='promo'){const p={...v,percent:Number(v.percent),maxDiscount:Number(v.maxDiscount),minSubtotal:Number(v.minSubtotal),active:v.active==='on'};const s={...D.settings,promos:[...D.settings.promos.filter(x=>x.code!==p.code),p]};await saveSettings(s);close();await refresh();toast('Промокод сохранён');return;}
 if(kind==='zone'){const z={...v,fee:Number(v.fee),enabled:v.enabled==='on'};await saveSettings({...D.settings,zones:[...D.settings.zones.filter(x=>x.id!==z.id),z]});close();await refresh();toast('Зона сохранена');return;}
 if(kind==='category'){const base=D.categories.find(c=>c.id===v.id)||{icon:'bag',image:'hero'};const cats=[...D.categories.filter(c=>c.id!==v.id),{...base,...v}];await API.request('admin/categories',{method:'PUT',body:{categories:cats}});close();await refresh();toast('Категория сохранена');return;}
 if(kind==='reply'){await API.request('admin/tickets/'+encodeURIComponent(f.dataset.id),{method:'PUT',body:{reply:v.reply,status:v.status}});await refresh();toast('Ответ сохранён');return;}
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;ev.preventDefault();doAction(el).catch(error);});
document.addEventListener('submit',async ev=>{const f=ev.target;if(!f.matches('form[data-form]'))return;ev.preventDefault();const b=f.querySelector('button[type=submit]');if(b?.disabled)return;if(b)b.disabled=true;try{await submit(f);}catch(err){error(err);}finally{if(b)b.disabled=false;}});
let searchTimer;document.addEventListener('input',ev=>{if(ev.target.id==='admin-search'){search=ev.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const input=$('#admin-search');input.focus();input.setSelectionRange(search.length,search.length);},200);}});
document.addEventListener('change',async ev=>{if(ev.target.id!=='product-image-file')return;const file=ev.target.files?.[0];if(!file)return;if(file.size>2500000){toast('Файл должен быть меньше 2,5 МБ.');return;}try{const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.slice(i,i+8192));const r=await API.request('admin/upload',{method:'POST',body:{data:btoa(binary)}});draftImage=r.image;$('#image-result').textContent='Загружено: '+r.image;toast('Фото загружено. Сохраните товар.');}catch(err){error(err);}});
async function init(){try{D=await API.init();if(D){try{const u=await API.request('me');if(['admin','manager'].includes(u.role)){user=u;await refresh();return;}}catch(_){} }render();}catch(err){error(err);render();}finally{window.KEREK_BOOT_DONE=true;window.KerekSplash?.finish();}}
init();
})();
</script></body></html>
