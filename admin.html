function support(){return '<div class="stack">'+(O.tickets.length?O.tickets.map(t=>'<div class="card"><div class="flex between"><h3>'+e(t.id)+' · '+(t.kind==='return'?'Запрос на возврат':'Вопрос')+'</h3><span class="pill">'+e(t.status)+'</span></div><p class="small">Заказ: '+e(t.orderId||'не указан')+' · '+dt(t.createdAt)+'</p><p style="white-space:pre-wrap">'+e(t.text)+'</p><form data-form="reply" data-id="'+e(t.id)+'"><label class="field">Ответ<textarea name="reply" maxlength="3000" required>'+e(t.reply)+'</textarea></label><div class="flex"><select name="status"><option value="answered">Есть ответ</option><option value="closed">Закрыто</option><option value="open">Открыто</option></select><button type="submit" class="btn primary">Сохранить ответ</button></div></form><p class="small mt">Ответ увидит пользователь в приложении. Реального возврата денег эта форма не делает.</p></div>').join(''):'<div class="card"><h2>Обращений пока нет</h2></div>')+'</div>';}
function settings(){const s=D.settings;return '<div class="stack"><div class="card"><h2>Правила магазина</h2><form data-form="settings"><div class="checkout-grid">'+[['minOrder','Минимальный заказ, ₸',1000000],['deliveryFee','Базовая доставка, ₸',100000],['freeDeliveryFrom','Бесплатная доставка от, ₸',1000000],['bonusRate','Начисление бонусов, %',30],['maxBonusPercent','Максимум оплаты бонусами, %',90],['referralReward','Бонус за приглашение',100000]].map(([k,n,max])=>'<label class="field">'+n+'<input name="'+k+'" type="number" min="0" max="'+max+'" value="'+s[k]+'" required></label>').join('')+'</div><label class="field">Интервалы доставки, через запятую<input name="slots" value="'+e(s.slots.join(', '))+'" required></label><button type="submit" class="btn primary">Сохранить правила</button></form><p class="small mt">Бесплатная доставка считается по сумме товаров до промокода. Бонусы — после промокода, без стоимости доставки. У конкретной зоны свой тариф.</p></div><div class="card"><div class="flex between"><h2>Промокоды</h2>'+button('new-promo','Добавить')+'</div><div class="table-scroll"><table class="admin-table"><tr><th>Код</th><th>Скидка</th><th>Лимит</th><th>Действует до</th><th></th></tr>'+s.promos.map(p=>'<tr><td>'+e(p.code)+(p.active?'':' · выключен')+'</td><td>'+p.percent+'%</td><td>'+money(p.maxDiscount)+'</td><td>'+e(p.endsAt||'—')+'</td><td>'+button('edit-promo','Изменить','data-id="'+e(p.code)+'"','outline')+'</td></tr>').join('')+'</table></div></div><div class="card"><div class="flex between"><h2>Зоны доставки</h2>'+button('new-zone','Добавить')+'</div>'+s.zones.map(z=>'<div class="address-card"><div><b>'+e(z.name)+'</b><p>'+money(z.fee)+' · '+(z.enabled?'Включена':'Выключена')+'</p></div>'+button('edit-zone','Изменить','data-id="'+e(z.id)+'"','outline')+'</div>').join('')+'<p class="note">Это именованные тарифные зоны. Географические границы и проверка адреса не подключены; нельзя считать зону подтверждённой по введённой строке адреса.</p></div></div>';}
function categories(){return '<div class="card"><div class="flex between"><h2>Категории</h2>'+button('new-category','Добавить','','primary')+'</div>'+D.categories.map(c=>'<div class="address-card"><div><b>'+e(c.name)+'</b><p>'+e(c.name_kk)+' · '+e(c.id)+'</p></div>'+button('edit-category','Изменить','data-id="'+e(c.id)+'"','outline')+'</div>').join('')+'</div>';}
function audit(){return '<div class="card"><h2>Журнал критических действий</h2><p class="small">Последние 200 операций. Пароли, коды и содержимое обращений не записываются в аудит.</p><div class="table-scroll"><table class="admin-table audit"><tr><th>Когда</th><th>Кто (ID)</th><th>Действие</th><th>Объект</th><th>Детали</th></tr>'+A.map(a=>'<tr><td>'+dt(a.created_at)+'</td><td>'+e(a.actor.slice(0,12))+'</td><td>'+e(a.action)+'</td><td>'+e(a.target)+'</td><td>'+e(a.detail)+'</td></tr>').join('')+'</table></div></div>';}
function modal(title,html){const d=$('#admin-modal');d.innerHTML='<div class="modal-head"><h2 id="modal-title">'+title+'</h2>'+button('close','✕','','outline')+'</div><div class="modal-body">'+html+'</div>';if(!d.open)d.showModal();}
function close(){const d=$('#admin-modal');d.close();d.innerHTML='';}
async function refresh(){D=await API.request('bootstrap');O=await API.request('admin/overview');if(user.role==='admin')A=await API.request('admin/audit');render();}
function productModal(id){const isNew=!id;const p=D.products.find(p=>p.id===id)||{id:'sku-'+Date.now().toString(36),name:'',name_kk:'',price:1000,oldPrice:0,stock:10,pack:500,unit:'g',category:'produce',subcategory:'vegetables',ingredient:'new_ingredient',brand:'',image:'',emoji:'🛍️',popularity:0,active:true,demo:true,composition:null,storage:null,description:'Демонстрационный товар.',allergens:[]};draftImage=p.image;modal(isNew?'Добавить товар':e(p.name),'<form data-form="product" data-original="'+e(p.id)+'"><div class="form-grid"><label class="field">ID<input name="id" value="'+e(p.id)+'" '+(!isNew?'readonly':'')+' pattern="[a-zA-Z0-9_-]{1,50}" required></label><label class="field">Бренд<input name="brand" value="'+e(p.brand)+'" maxlength="80"></label><label class="field full-width">Название, RU<input name="name" value="'+e(p.name)+'" minlength="2" maxlength="150" required></label><label class="field full-width">Название, ҚАЗ<input name="name_kk" value="'+e(p.name_kk)+'" minlength="2" maxlength="150" required></label>'+[['price','Цена, ₸',1,10000000],['oldPrice','Старая цена (0 — без скидки)',0,10000000],['stock','Остаток, упаковок',0,1000000],['pack','Количество в упаковке',1,100000]].map(([k,n,min,max])=>'<label class="field">'+n+'<input type="number" name="'+k+'" value="'+p[k]+'" min="'+min+'" max="'+max+'" required></label>').join('')+'<label class="field">Единицы<select name="unit">'+[['g','г'],['ml','мл'],['pc','шт.']].map(([id,n])=>'<option value="'+id+'" '+(p.unit===id?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label class="field">Категория<select name="category">'+D.categories.filter(c=>c.id!=='all').map(c=>'<option value="'+e(c.id)+'" '+(p.category===c.id?'selected':'')+'>'+e(c.name)+'</option>').join('')+'</select></label><label class="field">Подкатегория<input name="subcategory" value="'+e(p.subcategory)+'" maxlength="50"></label><label class="field">Ключ ингредиента<input name="ingredient" value="'+e(p.ingredient)+'" pattern="[a-zA-Z0-9_-]{1,50}" required></label><label class="field full-width">Фотография JPEG / PNG / WebP<input type="file" id="product-image-file" accept="image/jpeg,image/png,image/webp"><span class="small" id="image-result">'+e(p.image||'Не загружена')+'</span></label><label class="field full-width">Состав (только проверенный)<textarea name="composition" maxlength="2000">'+e(p.composition||'')+'</textarea></label><label class="field full-width">Хранение (только проверенные данные)<textarea name="storage" maxlength="1000">'+e(p.storage||'')+'</textarea></label><label class="field full-width">Описание<textarea name="description" maxlength="2000">'+e(p.description)+'</textarea></label></div><label class="check"><input type="checkbox" name="active" '+(p.active?'checked':'')+'>Показывать в каталоге</label><p class="note">Снимите отметку для архивирования. Товар остаётся в истории заказов. Ключ ингредиента используется рецептами: например milk, rice, chicken.</p><button class="btn primary block" type="submit">Сохранить товар</button></form>');}
function orderModal(id){const o=O.orders.find(o=>o.id===id);if(!o)return;const next={created:'assembling',assembling:'ready',ready:'delivering',delivering:'delivered'}[o.status];modal(e(o.id),'<span class="pill">'+status[o.status]+'</span><p class="note mt">ТЕСТ. Деньги не списаны, реального курьера нет. Статус меняется вручную.</p><p><b>'+e(o.address)+'</b><br>'+e(o.slot)+'</p><p class="small">Комментарий: '+e(o.comment||'нет')+'<br>Замены: '+e(o.replacements)+'</p>'+o.items.map(i=>'<div class="spec-row"><span>'+e(i.name)+' × '+i.qty+'</span><b>'+money(i.price*i.qty)+'</b></div>').join('')+'<div class="summary-row total"><b>Итого</b><b>'+money(o.quote.total)+'</b></div><div class="form-actions">'+(next?button('order-status','Следующий статус: '+status[next],'data-id="'+e(o.id)+'" data-status="'+next+'"','primary'):'')+(['created','assembling','ready'].includes(o.status)?button('order-status','Отменить и вернуть остатки','data-id="'+e(o.id)+'" data-status="cancelled"','danger'):'')+'</div><h3 class="mt">История</h3>'+o.timeline.map(t=>'<div class="spec-row"><b>'+status[t.status]+'</b><span>'+dt(t.at)+'</span></div>').join(''));}
function promoModal(id){const p=D.settings.promos.find(p=>p.code===id)||{code:'',percent:10,maxDiscount:2000,minSubtotal:1000,endsAt:'',active:true};modal('Настройка промокода','<form data-form="promo" data-original="'+e(id||'')+'"><label class="field">Код<input name="code" value="'+e(p.code)+'" pattern="[A-Z0-9_-]{2,40}" required '+(id?'readonly':'')+'></label><div class="form-grid">'+[['percent','Скидка, %',90],['maxDiscount','Максимальная скидка, ₸',100000],['minSubtotal','Минимум товаров, ₸',1000000]].map(([k,n,max])=>'<label class="field">'+n+'<input name="'+k+'" type="number" min="0" max="'+max+'" required value="'+p[k]+'"></label>').join('')+'<label class="field">Действует до<input name="endsAt" type="date" value="'+e(p.endsAt)+'"></label></div><label class="check"><input name="active" type="checkbox" '+(p.active?'checked':'')+'>Активен</label><button type="submit" class="btn primary block">Сохранить</button></form>');}
function zoneModal(id){const z=D.settings.zones.find(z=>z.id===id)||{id:'zone-'+Date.now().toString(36),name:'',fee:990,enabled:true};modal('Тарифная зона','<form data-form="zone" data-original="'+e(id||'')+'"><label class="field">ID<input name="id" value="'+e(z.id)+'" pattern="[a-z0-9_-]{1,40}" '+(id?'readonly':'')+' required></label><label class="field">Название<input name="name" value="'+e(z.name)+'" minlength="2" maxlength="100" required></label><label class="field">Доставка, ₸<input name="fee" type="number" min="0" max="100000" value="'+z.fee+'" required></label><label class="check"><input name="enabled" type="checkbox" '+(z.enabled?'checked':'')+'>Включена</label><button type="submit" class="btn primary block">Сохранить</button></form>');}
function categoryModal(id){const c=D.categories.find(c=>c.id===id)||{id:'category-'+Date.now().toString(36),name:'',name_kk:'',icon:'bag',image:'hero'};modal('Категория','<form data-form="category" data-original="'+e(id||'')+'"><label class="field">ID<input name="id" value="'+e(c.id)+'" '+(id?'readonly':'')+' pattern="[a-z0-9_-]{1,40}" required></label><label class="field">Название RU<input name="name" value="'+e(c.name)+'" minlength="2" maxlength="80" required></label><label class="field">Название ҚАЗ<input name="name_kk" value="'+e(c.name_kk)+'" minlength="2" maxlength="80" required></label><button type="submit" class="btn primary block">Сохранить</button></form>');}
async function doAction(el){const a=el.dataset.action,id=el.dataset.id;
 if(a==='close'){close();return;}
 if(a==='tab'){tab=id;if(tab==='audit')A=await API.request('admin/audit');render();return;}
 if(a==='refresh'){await refresh();toast('Данные обновлены');return;}
 if(a==='logout'){await API.request('auth/logout',{method:'POST',body:{}});API.setSession('');user=null;close();render();return;}
 if(a==='new-product'||a==='edit-product'){productModal(a==='edit-product'?id:null);return;}
 if(a==='order'){orderModal(id);return;}
 if(a==='order-status'){if(!confirm('Изменить статус ТЕСТОВОГО заказа на «'+status[el.dataset.status]+'»?'))return;await API.request('admin/orders/'+encodeURIComponent(id)+'/status',{method:'POST',body:{status:el.dataset.status}});await refresh();orderModal(id);toast('Статус сохранён');return;}
 if(a==='new-promo'||a==='edit-promo'){promoModal(id);return;}
 if(a==='new-zone'||a==='edit-zone'){zoneModal(id);return;}
 if(a==='new-category'||a==='edit-category'){categoryModal(id);return;}
}
async function saveSettings(settings){await API.request('admin/settings',{method:'PUT',body:settings});}
async function submit(f){const v=Object.fromEntries(new FormData(f)),kind=f.dataset.form;
 if(kind==='login'){const r=await API.request('auth/admin',{method:'POST',body:{username:v.username,password:v.password}});API.setSession(r.csrf);user=r.user;await refresh();return;}
 if(kind==='product'){
  const base=D.products.find(p=>p.id===f.dataset.original)||{emoji:'🛍️',popularity:0,demo:true,allergens:[]};
  const body={...base,...v,price:Number(v.price),oldPrice:Number(v.oldPrice),stock:Number(v.stock),pack:Number(v.pack),active:v.active==='on',image:draftImage,composition:v.composition||null,storage:v.storage||null};
  await API.request('admin/products/'+encodeURIComponent(body.id),{method:'PUT',body});close();await refresh();toast('Товар сохранён');return;
 }
 if(kind==='settings'){const s={...D.settings};for(const k of ['minOrder','deliveryFee','freeDeliveryFrom','bonusRate','maxBonusPercent','referralReward'])s[k]=Number(v[k]);s.slots=v.slots.split(',').map(x=>x.trim()).filter(Boolean);if(s.slots.some(x=>!/^\d{2}:\d{2}–\d{2}:\d{2}$/.test(x)))throw new Error('Интервалы должны иметь вид 10:00–12:00 (длинное тире).');await saveSettings(s);await refresh();toast('Правила сохранены');return;}
 if(kind==='promo'){const p={...v,percent:Number(v.percent),maxDiscount:Number(v.maxDiscount),minSubtotal:Number(v.minSubtotal),active:v.active==='on'};const s={...D.settings,promos:[...D.settings.promos.filter(x=>x.code!==p.code),p]};await saveSettings(s);close();await refresh();toast('Промокод сохранён');return;}
 if(kind==='zone'){const z={...v,fee:Number(v.fee),enabled:v.enabled==='on'};await saveSettings({...D.settings,zones:[...D.settings.zones.filter(x=>x.id!==z.id),z]});close();await refresh();toast('Зона сохранена');return;}
 if(kind==='category'){const base=D.categories.find(c=>c.id===v.id)||{icon:'bag',image:'hero'};const cats=[...D.categories.filter(c=>c.id!==v.id),{...base,...v}];await API.request('admin/categories',{method:'PUT',body:{categories:cats}});close();await refresh();toast('Категория сохранена');return;}
 if(kind==='reply'){await API.request('admin/tickets/'+encodeURIComponent(f.dataset.id),{method:'PUT',body:{reply:v.reply,status:v.status}});await refresh();toast('Ответ сохранён');return;}
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;ev.preventDefault();doAction(el).catch(error);});
document.addEventListener('submit',async ev=>{const f=ev.target;if(!f.matches('form[data-form]'))return;ev.preventDefault();const b=f.querySelector('button[type=submit]');if(b?.disabled)return;if(b)b.disabled=true;try{await submit(f);}catch(err){error(err);}finally{if(b)b.disabled=false;}});
let searchTimer;document.addEventListener('input',ev=>{if(ev.target.id==='admin-search'){search=ev.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const input=$('#admin-search');input.focus();input.setSelectionRange(search.length,search.length);},200);}});
document.addEventListener('change',async ev=>{if(ev.target.id!=='product-image-file')return;const file=ev.target.files?.[0];if(!file)return;if(file.size>2500000){toast('Файл должен быть меньше 2,5 МБ.');return;}try{const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.slice(i,i+8192));const r=await API.request('admin/upload',{method:'POST',body:{data:btoa(binary)}});draftImage=r.image;$('#image-result').textContent='Загружено: '+r.image;toast('Фото загружено. Сохраните товар.');}catch(err){error(err);}});
async function init(){try{D=await API.init();if(D){try{const u=await API.request('me');if(['admin','manager'].includes(u.role)){user=u;await refresh();return;}}catch(_){} }render();}catch(err){error(err);render();}}
init();
})();
</script></body></html>
